title: "Manutenzione della casa"
summary: "I lavori stagionali e annuali di cui ogni casa ha bisogno, ripetuti così non devi ricordarli."
description: "Alcuni lavori capitano una volta a stagione o una volta l'anno, ed è proprio per questo che si dimenticano. Ogni attività qui si [ripete](https://open-todo.app/docs/recurrence/) con il suo intervallo; aggiungi un [promemoria](https://open-todo.app/docs/reminders/) a quelle che richiedono di prenotare un tecnico.\n"
howToUse.0: "Avvia il modello; ogni attività si ripete con il suo intervallo, da mensile ad annuale."
howToUse.1: "Apri quelle che richiedono un tecnico e aggiungi un promemoria una settimana prima."
howToUse.2: "Completa un'attività quando è fatta e compare la prossima ripetizione."
makeItYours.0: "Elimina quello che la tua casa non ha (niente camino, niente giardino) e aggiungi quello che ha."
makeItYours.1: "Adatta gli intervalli al clima: grondaie più spesso sotto gli alberi, meno in un appartamento."
makeItYours.2: "Condividilo con chi si occupa della casa insieme a te."
