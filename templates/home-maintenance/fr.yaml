title: "Entretien de la maison"
summary: "Les tâches récurrentes annuelles et saisonnières indispensables à tout foyer, évitant ainsi d’avoir à les garder en mémoire."
description: "Certains travaux ne se présentent qu'une fois par saison ou par an, et c'est précisément pour cela qu'on les oublie. Chaque tâche [se répète](https://open-todo.app/docs/recurrence/)  à son propre intervalle; ajoute un [rappel](https://open-todo.app/docs/reminders/) à celles qui nécessitent la réservation d'un artisan.\n"
howToUse.0: "Lance le modèle ; chaque tâche se répète selon son propre intervalle, de mensuel à annuel."
howToUse.1: "Ouvre celles qui nécessitent un technicien et ajoute un rappel une semaine avant."
howToUse.2: "Termine une tâche lorsqu'elle est faite et la prochaine récurrence apparaîtra."
makeItYours.0: "Supprime ce que ta maison n'a pas (pas de cheminée, pas de jardin) et ajoute ce qu'elle a."
makeItYours.1: "Adapte les intervalles au climat : les gouttières plus souvent sous les arbres, moins dans un appartement."
makeItYours.2: "Partage-le avec les personnes qui s'occupent de la maison avec toi."
