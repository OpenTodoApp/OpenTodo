title: "Planifier les repas"
summary: "Un rythme hebdomadaire pour choisir les repas, rédiger la liste de courses et cuisiner à l'avance."
description: "Planifier les repas une fois par semaine permet d'économiser de l'argent et des soirées. Ce modèle instaure un rythme le dimanche avec des [tâches récurrentes](https://open-todo.app/docs/recurrence/) : choisir, faire la liste, faire les courses, préparer.\n\nConserve la liste de courses dans le même [projet partagé](https://open-todo.app/docs/sharing/), afin que la personne au supermarché puisse la voir mise à jour.\n"
howToUse.0: "Lance le modèle ; le rythme du dimanche se répète chaque semaine : choisir, rédiger la liste, faire les courses, préparer."
howToUse.1: "Partage le projet pour que la personne au supermarché voie la liste mise à jour."
howToUse.2: "Ajoute les achats de la semaine comme sous-tâches des courses et coche-les dans les allées du magasin."
makeItYours.0: "Déplace le jour de la planification au moment où ta semaine commence."
makeItYours.1: "Ajoute une section par jour avec le plat comme titre de la tâche, afin de visualiser le menu sur ton téléphone."
makeItYours.2: "Conserve une section \"Réserves\" avec les produits indispensables et pioche dedans."
