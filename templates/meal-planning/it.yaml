title: "Pianificare i pasti"
summary: "Un ritmo settimanale per scegliere i pasti, scrivere la lista della spesa e preparare in anticipo."
description: "Pianificare i pasti una volta a settimana fa risparmiare soldi e serate. Questo modello imposta un ritmo domenicale con [attività che si ripetono](https://open-todo.app/docs/recurrence/): scegliere, scrivere la lista, fare la spesa, preparare.\n\nTieni la lista della spesa nello stesso [progetto condiviso](https://open-todo.app/docs/sharing/), così chi è al supermercato la vede aggiornata.\n"
