title: "Organiser un voyage"
summary: "Réservations, documents et une liste de bagages avec des sous-tâches, pour des vacances ou un déplacement professionnel."
description: "Un voyage comprend trois phases : réserver, gérer les documents, faire sa valise. Ce modèle attribue une section à chacune et utilise les [sous-tâches](https://open-todo.app/docs/tasks-and-projects/) pour la liste de bagages, afin que tu puisses cocher les éléments depuis ton téléphone pendant que tu te prépares.\n\nAjoute un [rappel](https://open-todo.app/docs/reminders/) à la tâche du passeport si le voyage est lointain : les renouvellements prennent du temps.\n"
howToUse.0: "Lance le modèle ; les trois sections sont réserver, documents et valise."
howToUse.1: "Ajoute un rappel à la tâche du passeport si le voyage est lointain."
howToUse.2: "Coche les sous-tâches de la valise depuis ton téléphone pendant que tu te prépares."
makeItYours.0: "Copie la liste de bagages dans un projet \"Valise type\" et réutilise-la pour chaque voyage."
makeItYours.1: "Partage le projet avec tes compagnons de voyage et attribue une réservation à chacun."
makeItYours.2: "Ajoute les dates : vols, enregistrement, la date limite pour souscrire l’assurance."
