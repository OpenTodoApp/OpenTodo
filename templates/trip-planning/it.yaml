title: "Organizzare un viaggio"
summary: "Prenotazioni, documenti e una lista di cose da mettere in valigia con le sottoattività, per una vacanza o un viaggio di lavoro."
description: "Un viaggio ha tre fasi: prenotare, sistemare i documenti, fare la valigia. Questo modello dà a ognuna una sezione e usa le [sottoattività](https://open-todo.app/docs/tasks-and-projects/) per la lista della valigia, così puoi spuntare le cose dal telefono mentre prepari.\n\nAggiungi un [promemoria](https://open-todo.app/docs/reminders/) all'attività del passaporto se il viaggio è lontano: i rinnovi richiedono tempo.\n"
howToUse.0: "Avvia il modello; le tre sezioni sono prenotare, documenti e valigia."
howToUse.1: "Aggiungi un promemoria all'attività del passaporto se il viaggio è lontano."
howToUse.2: "Spunta le sottoattività della valigia dal telefono mentre prepari."
makeItYours.0: "Copia la lista della valigia in un progetto \"Valigia standard\" e riusala per ogni viaggio."
makeItYours.1: "Condividi il progetto con chi viaggia con te e dividetevi le prenotazioni."
makeItYours.2: "Aggiungi le date: voli, check-in, il giorno entro cui sistemare l'assicurazione."
