title: "Plan d’étude"
summary: "Blocs d’étude hebdomadaires, révisions et dates d’examen pour un cours ou une certification."
description: "On étudie mieux avec un rythme. Ce modèle place des blocs d’étude fixes dans le [calendrier hebdomadaire](https://open-todo.app/docs/time-blocking/) avec des [règles de récurrence](https://open-todo.app/docs/recurrence/), plus les étapes clés qui te maintiennent sur la bonne voie.\n"
howToUse.0: "Lance le modèle ; les blocs d’étude se répètent à des jours fixes et disposent déjà d’une estimation."
howToUse.1: "Ouvre le calendrier hebdomadaire pour voir les blocs à leur place et fais-les glisser vers les horaires de ton choix."
howToUse.2: "Les étapes clés se calculent à partir du jour de début ; fixe la date de l’examen et décale-les à rebours à partir de là."
makeItYours.0: "Un projet par matière, avec les mêmes sections, permet une révision honnête."
makeItYours.1: "Raccourcis les blocs si tu travailles mieux par courtes sessions ; le guide de la méthode Pomodoro explique comment faire."
makeItYours.2: "Ajoute une étiquette `@révision` et une vue enregistrée pour les deux dernières semaines."
