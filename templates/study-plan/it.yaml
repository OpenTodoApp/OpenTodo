title: "Piano di studio"
summary: "Blocchi di studio settimanali, ripasso e date d'esame per un corso o una certificazione."
description: "Si studia meglio con un ritmo. Questo modello mette blocchi di studio fissi nel [calendario settimanale](https://open-todo.app/docs/time-blocking/) con [regole di ripetizione](https://open-todo.app/docs/recurrence/), più le tappe che ti tengono in carreggiata.\n"
howToUse.0: "Avvia il modello; i blocchi di studio si ripetono in giorni fissi e hanno già una stima."
howToUse.1: "Apri il calendario settimanale per vedere i blocchi al loro posto e trascinali agli orari che preferisci."
howToUse.2: "Le tappe contano dal giorno di inizio; fissa la data dell'esame e spostale a ritroso da lì."
makeItYours.0: "Un progetto per materia, con le stesse sezioni, rende il ripasso onesto."
makeItYours.1: "Accorcia i blocchi se lavori meglio a scatti brevi; la guida al Pomodoro spiega come."
makeItYours.2: "Aggiungi un'etichetta `@ripasso` e una vista salvata per le ultime due settimane."
