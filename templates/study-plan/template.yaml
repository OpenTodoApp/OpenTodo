# Study plan: a template of the OpenTodo library (templates/README.md). Licence: CC BY 4.0.
title: Study plan
summary: Weekly study blocks, revision and exam dates for a course or certification.
description: |
  Studying works best as a rhythm. This template puts fixed study blocks on your [Week calendar](https://open-todo.app/docs/time-blocking/) with [repeating rules](https://open-todo.app/docs/recurrence/), plus the milestones that keep you on track.
howToUse:
  - Start the template; the study blocks repeat on fixed days and already carry estimates.
  - Open the Week calendar to see the blocks in place, and drag them to the hours that suit you.
  - Milestones count from the start day; set the exam date and move them back from it.
makeItYours:
  - One project per subject, with the same sections, keeps revision honest.
  - Shorten the blocks if you work better in short bursts; the Pomodoro guide shows how.
  - Add a `@revise` label and a saved view for the last two weeks.
category: study
icon: graduation-cap
author: OpenTodo
reviewed: 2026-10-15
docs:
  - time-blocking.md
  - recurrence.md
labels:
  - name: study
projects:
  - name: Study plan
    color: "#db2777"
    sections:
      - name: Weekly rhythm
        tasks:
          - title: Study block, new material
            due: +1d
            time: 19:00
            recurrence: every monday, wednesday
            estimate: 90
            labels: [study]
          - title: Practice questions
            due: +5d
            time: 10:00
            recurrence: every saturday
            estimate: 60
            labels: [study]
      - name: Milestones
        tasks:
          - title: Finish the first half of the syllabus
            priority: 2
            due: +6w
          - title: Full mock exam
            priority: 1
            due: +10w
            estimate: 180
          - title: Exam day
            priority: 1
            due: +12w
