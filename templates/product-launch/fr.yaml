title: "Lancement d'un produit"
summary: "Le plan de lancement d'une petite équipe sur un tableau, des vérifications finales à l'annonce et à la semaine qui suit."
description: "Un lancement nécessite que tout le monde voie le même plan. Lance ce modèle, [partage le projet](https://open-todo.app/docs/sharing/) avec l'équipe en tant qu'éditeurs et affiche-le sous forme de [tableau](https://open-todo.app/docs/sections-and-boards/) : À faire, Cette semaine, Jour du lancement, Semaine suivante.\n\nLes tâches disposent d'estimations, de sorte que le [calendrier hebdomadaire](https://open-todo.app/docs/time-blocking/) indique si le plan tient dans les jours dont tu disposes.\n"
howToUse.0: "Lance le modèle, partage le projet avec l'équipe en tant qu'éditeurs et affiche-le sous forme de tableau."
howToUse.1: "Attribue les tâches et donne à chacune une estimation ; le calendrier hebdomadaire indique si le plan tient dans les jours dont tu disposes."
howToUse.2: "Déplace les cartes entre À faire, Cette semaine, Jour du lancement et Semaine suivante au fur et à mesure que le lancement approche."
makeItYours.0: "Renomme les sections selon tes propres phases, ou ajoute une colonne \"Bloqué\"."
makeItYours.1: "Enregistre une vue `#Lancement & due <= 7 days` pour la réunion quotidienne."
makeItYours.2: "Ajoute une étiquette par domaine d'activité (`@marketing`, `@développement`) et filtre le tableau."
