title: "Lancio di un prodotto"
summary: "Il piano di lancio di un piccolo team su una bacheca, dalle verifiche finali all'annuncio e alla settimana dopo."
description: "Un lancio ha bisogno che tutti vedano lo stesso piano. Avvia questo modello, [condividi il progetto](https://open-todo.app/docs/sharing/) con il team come editor e mostralo come [bacheca](https://open-todo.app/docs/sections-and-boards/): Da fare, Questa settimana, Giorno del lancio, Settimana dopo.\n\nLe attività hanno delle stime, così il [calendario settimanale](https://open-todo.app/docs/time-blocking/) mostra se il piano sta nei giorni che hai.\n"
howToUse.0: "Avvia il modello, condividi il progetto con il team come editor e mostralo come bacheca."
howToUse.1: "Assegna le attività e dai a ognuna una stima; il calendario settimanale mostra se il piano sta nei giorni che hai."
howToUse.2: "Sposta le schede tra Da fare, Questa settimana, Giorno del lancio e Settimana dopo man mano che il lancio si avvicina."
makeItYours.0: "Rinomina le sezioni con le tue fasi, o aggiungi una colonna \"Bloccato\"."
makeItYours.1: "Salva una vista `#Lancio & due <= 7 days` per la riunione quotidiana."
makeItYours.2: "Aggiungi un'etichetta per area di lavoro (`@marketing`, `@sviluppo`) e filtra la bacheca."
