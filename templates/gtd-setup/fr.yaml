# Configuration Getting Things Done: French text for templates/gtd-setup/template.yaml (templates/README.md, "Translations").
sourceHash: sha-3e163508c50d
title: "Configuration Getting Things Done"
summary: "Des contextes, une liste \"en attente\" et une liste \"un jour\", prêts pour la méthode GTD en quelques minutes."
description: "Getting Things Done fonctionne avec n'importe quel outil disposant d'une boîte de réception, de contextes et de listes. Dans OpenTodo, les contextes sont des [étiquettes](https://open-todo.app/docs/labels-and-filters/) et chaque liste est un filtre enregistré.\n\nCe modèle crée les [étiquettes](https://open-todo.app/docs/labels-and-filters/) `@maison`, `@ordinateur`, `@téléphone`, `@courses`, `@en-attente` et `@un-jour`, un projet GTD doté des sections actions suivantes, en attente et un jour, ainsi qu'un rappel hebdomadaire pour vérifier que chaque projet possède une action suivante.\n\nCrée des vues telles que `@téléphone & !@en-attente` pour les moments où tu n'as que ton téléphone. Les [vues enregistrées](https://open-todo.app/docs/views/) peuvent être épinglées dans la barre latérale avec les compteurs mis à jour.\n"
howToUse.0: "Lance le modèle ; crée les étiquettes, le projet GTD et ses sections."
howToUse.1: "Enregistre les vues suggérées par le guide, telles que `@téléphone & !@en-attente`, et épingle-les dans la barre latérale."
howToUse.2: "Chaque vendredi, l'activité de révision te demande de vérifier que chaque projet possède une action suivante."
makeItYours.0: "Renomme les contextes avec les lieux où tu travailles réellement : `@bureau`, `@atelier`, `@centre`."
makeItYours.1: "Supprime les sections dont tu ne te sers pas : un système plus petit est un système que tu maintiens plus facilement."
makeItYours.2: "Programme l'activité de révision à un horaire adapté à ta semaine."
