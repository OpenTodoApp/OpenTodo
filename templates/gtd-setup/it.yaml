sourceHash: sha-3e163508c50d
title: "Configurazione Getting Things Done"
summary: "Contesti, una lista delle attese e una lista \"un giorno\", pronti per il metodo GTD in pochi minuti."
description: "Getting Things Done funziona con qualsiasi strumento che abbia una inbox, dei contesti e delle liste. In OpenTodo i contesti sono [etichette](https://open-todo.app/docs/labels-and-filters/) e ogni lista è un filtro salvato.\n\nIl modello crea le [etichette](https://open-todo.app/docs/labels-and-filters/) `@casa`, `@computer`, `@telefono`, `@commissione`, `@in-attesa` e `@un-giorno`, un progetto GTD con le sezioni prossime azioni, in attesa e un giorno, e un promemoria settimanale per controllare che ogni progetto abbia una prossima azione.\n\nCrea viste come `@telefono & !@in-attesa` per i momenti in cui hai solo il telefono. Le [viste salvate](https://open-todo.app/docs/views/) si possono fissare nella barra laterale con i conteggi aggiornati.\n"
howToUse.0: "Avvia il modello; crea le etichette, il progetto GTD e le sue sezioni."
howToUse.1: "Salva le viste suggerite dalla guida, come `@telefono & !@in-attesa`, e fissale nella barra laterale."
howToUse.2: "Ogni venerdì l'attività di revisione ti chiede di controllare che ogni progetto abbia una prossima azione."
makeItYours.0: "Rinomina i contesti con i luoghi dove lavori davvero: `@ufficio`, `@laboratorio`, `@centro`."
makeItYours.1: "Elimina le sezioni che non usi: un sistema più piccolo è uno che mantieni."
makeItYours.2: "Dai all'attività di revisione un orario adatto alla tua settimana."
