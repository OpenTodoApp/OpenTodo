title: "Monatsrückblick"
summary: "Am Ersten jedes Monats entsteht ein Rückblick-Projekt aus der Vorlage Wochenrückblick."
description: "Ein Rückblick hält eine Aufgabenliste verlässlich. Am ersten Tag jedes Monats um 9:00 erstellt diese Routine ein Projekt aus der Bibliotheksvorlage Wochenrückblick, mit ihren Abschnitten und kleinen Aufgaben, beginnend an diesem Tag.\n\nLieber wöchentlich? Stell die Wann-Karte auf einen Wochentag um."
