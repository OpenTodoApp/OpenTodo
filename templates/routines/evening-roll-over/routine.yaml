title: Evening roll-over
summary: Every evening at 21:00, move what is still due today to tomorrow, and tell you how many.
description: |
  A day rarely goes to plan. Every evening at 21:00 this routine moves the tasks still due today to tomorrow, so the next morning starts from an honest list instead of a wall of overdue tasks.

  The notification tells you how many moved. Change the time on the When card to match the end of your day.
category: personal
icon: moon
author: OpenTodo
reviewed: 2026-11-01
trigger:
  kind: schedule
  at: "21:00"
  weekdays: [1, 2, 3, 4, 5, 6, 7]
condition:
  due: today
steps:
  - id: a
    kind: change_tasks
    in:
      tasks:
        ref: trigger
      set:
        literal:
          due: tomorrow
  - id: b
    kind: count
    in:
      list:
        ref: a
  - id: c
    kind: notify
    in:
      text:
        literal:
          format: "{b} tasks moved to tomorrow"
test:
  tasks:
    - id: d1
      due: 2026-10-21
    - id: d2
      due: 2026-10-21
    - id: d3
      due: 2026-10-25
  expect:
    changed:
      d1:
        due: 2026-10-22
      d2:
        due: 2026-10-22
    notices:
      - 2 tasks moved to tomorrow
