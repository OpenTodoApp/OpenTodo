title: "Seguimento de esperas"
summary: "Quando uma tarefa recebe a tua etiqueta de espera, regista a data e trá-la de volta daqui a três dias."
description: "Esperar por alguém é fácil de esquecer. Quando acrescentas a tua etiqueta de espera a uma tarefa, esta rotina comenta \"À espera desde\" com a data de hoje e faz a tarefa vencer daqui a três dias, para voltar a ti na altura de insistir.\n\nMuda o número de dias no último cartão conforme a rapidez habitual das respostas."
