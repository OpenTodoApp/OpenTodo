title: "Courses depuis une note"
summary: "Chaque vendredi à 17:00, transforme les lignes de ta note de courses en tâches."
description: "Garde un projet dont la note liste ce qu'il te faut, un article par ligne. Chaque vendredi à 17:00, cette routine lit la note et crée une tâche par ligne dans ton projet de commissions, prête pour les courses du week-end.\n\nLes puces et les cases à cocher sont retirées de chaque ligne. Vide la note à ton retour, ou garde-la comme liste permanente."
