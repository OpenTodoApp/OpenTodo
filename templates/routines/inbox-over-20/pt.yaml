summary: "Nas manhãs de dias úteis, avisa-te quando a tua caixa de entrada tem mais de 20 tarefas."
description: "Uma caixa de entrada funciona quando é esvaziada com frequência. Todos os dias úteis às 9:00 esta rotina conta as tarefas sem projeto e avisa-te quando são mais de 20, para saberes que é hora de as organizar.\n\nMuda o número no cartão Se para o tamanho que te parece demasiado."
