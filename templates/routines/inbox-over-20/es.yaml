summary: "Las mañanas de diario, te avisa cuando tu bandeja de entrada tiene más de 20 tareas."
description: "Una bandeja de entrada funciona cuando se vacía a menudo. Cada día laborable a las 9:00 esta rutina cuenta las tareas sin proyecto y te avisa cuando hay más de 20, para que sepas que toca ordenarlas.\n\nCambia el número en la tarjeta Si al tamaño que te parezca demasiado."
