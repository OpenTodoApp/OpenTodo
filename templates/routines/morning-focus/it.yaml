title: "Focus del mattino"
summary: "Nei giorni feriali, mette nel focus di oggi le tre attività più importanti in scadenza oggi."
description: "Ogni giorno feriale alle 7:30 questa routine trova le attività in scadenza oggi, le ordina per priorità e imposta le prime tre come focus di oggi, così inizi la giornata sapendo cosa viene prima.\n\nCambia il numero nella scheda Scegli per un focus più corto o più lungo. Serve il focus di oggi attivo."
