title: "Focus du matin"
summary: "Les matins de semaine, place dans le focus du jour les trois tâches les plus importantes prévues aujourd'hui."
description: "Chaque matin de semaine à 7:30, cette routine trouve les tâches prévues aujourd'hui, les trie par priorité et place les trois premières dans le focus du jour, pour commencer en sachant ce qui passe en premier.\n\nChange le nombre sur la carte Choisir pour un focus plus court ou plus long. Le focus du jour doit être activé."
