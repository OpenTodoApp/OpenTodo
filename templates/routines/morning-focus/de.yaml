title: "Morgenfokus"
summary: "An Werktagen morgens kommen die drei wichtigsten heute fälligen Aufgaben in den heutigen Fokus."
description: "Jeden Werktag um 7:30 findet diese Routine die heute fälligen Aufgaben, sortiert sie nach Priorität und setzt die ersten drei als heutigen Fokus, damit du weißt, was zuerst kommt.\n\nÄndere die Zahl auf der Auswählen-Karte für einen kürzeren oder längeren Fokus. Der heutige Fokus muss eingeschaltet sein."
