title: "Foco da manhã"
summary: "Nas manhãs de dias úteis, põe no foco de hoje as três tarefas mais importantes que vencem hoje."
description: "Todos os dias úteis às 7:30 esta rotina encontra as tarefas que vencem hoje, ordena-as por prioridade e define as três primeiras como foco de hoje, para começares o dia a saber o que vem primeiro.\n\nMuda o número no cartão Escolher para um foco mais curto ou mais longo. Precisa do foco de hoje ligado."
