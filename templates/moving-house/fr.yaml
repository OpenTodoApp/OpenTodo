sourceHash: sha-d0de7806bd94
title: "Déménagement"
summary: "Tout, de la résiliation au dernier carton, réparti dans des sections à partager avec les personnes qui déménagent."
description: "Un déménagement est un projet doté d'une échéance et impliquant de nombreuses personnes. Lance ce modèle, puis [partage le projet](https://open-todo.app/docs/sharing/) avec les personnes qui déménagent, afin que chacun puisse prendre en charge des tâches.\n\nLes sections suivent le calendrier, de six semaines avant jusqu'après le déménagement. Affiche le projet sous forme de [tableau](https://open-todo.app/docs/sections-and-boards/) pour voir les différentes phases côte à côte. Les dates d'échéance se calculent à partir de la date de début que tu choisis : définis la première, puis décale les autres en conséquence.\n"
howToUse.0: "Lance le modèle, puis partage le projet avec les personnes qui déménagent."
howToUse.1: "Les dates d'échéance se calculent à partir de la date de début ; fixe le jour du déménagement et décale les autres en conséquence."
howToUse.2: "Affiche le projet sous forme de tableau pour voir les différentes phases côte à côte."
makeItYours.0: "Supprime les tâches qui ne te concernent pas (pas d'animaux, pas de voiture) et ajoute celles dont tu as besoin."
makeItYours.1: "Attribue les démarches administratives à une personne et les cartons à tout le monde."
makeItYours.2: "Ajoute une étiquette `@appeler` pour les tâches qui nécessitent un appel pendant les heures de bureau."
