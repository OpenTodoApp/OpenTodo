title: "Trasloco"
summary: "Tutto, dalla disdetta all'ultimo scatolone, in sezioni da condividere con chi trasloca."
description: "Un trasloco è un progetto con una scadenza e tante persone coinvolte. Avvia questo modello, poi [condividi il progetto](https://open-todo.app/docs/sharing/) con chi trasloca, così ognuno può prendersi delle attività.\n\nLe sezioni seguono il calendario, da sei settimane prima a dopo il trasloco. Passa il progetto alla [bacheca](https://open-todo.app/docs/sections-and-boards/) per vedere le fasi una accanto all'altra. Le scadenze contano dal giorno di inizio che scegli, quindi sistema la prima e sposta le altre di conseguenza.\n"
howToUse.0: "Avvia il modello, poi condividi il progetto con chi trasloca."
howToUse.1: "Le scadenze contano dal giorno di inizio; fissa il giorno del trasloco e sposta le altre di conseguenza."
howToUse.2: "Passa il progetto alla bacheca per vedere le fasi una accanto all'altra."
makeItYours.0: "Elimina le attività che non ti riguardano (niente animali, niente auto) e aggiungi quelle che servono."
makeItYours.1: "Assegna le pratiche a una persona e gli scatoloni a tutti."
makeItYours.2: "Aggiungi un'etichetta `@telefonare` per le attività che richiedono una chiamata in orario d'ufficio."
