summary: "Un piano per i primi tre mesi, diviso in imparare, contribuire e guidare."
description: "I primi tre mesi in un nuovo lavoro passano in fretta. Questo modello li divide in imparare, contribuire e guidare, con [sottoattività](https://open-todo.app/docs/tasks-and-projects/) per i dettagli e stime per bloccare il tempo nel [calendario](https://open-todo.app/docs/time-blocking/).\n"
