# First 90 days in a new job: a template of the OpenTodo library (templates/README.md). Licence: CC BY 4.0.
title: First 90 days in a new job
summary: A plan for your first three months, split into learn, contribute and lead.
description: |
  The first three months in a new job go fast. This template breaks them into learning, contributing and leading, with [subtasks](https://open-todo.app/docs/tasks-and-projects/) for the details and estimates so you can block the time on your [calendar](https://open-todo.app/docs/time-blocking/).
howToUse:
  - Start the template; the three sections cover learning, contributing and leading over three months.
  - Give the first week's tasks a time on the Week calendar so they do not slip.
  - Complete the subtasks as you go; the parent shows your progress.
makeItYours:
  - Replace the placeholder names with your actual team and systems.
  - Add the questions you want answered by day 30, 60 and 90 as subtasks.
  - Keep it private, or share a copy of the first section with your manager.
category: work
icon: briefcase
layout: list
author: OpenTodo
reviewed: 2026-10-15
docs:
  - tasks-and-projects.md
  - time-blocking.md
labels:
  - name: people
projects:
  - name: First 90 days
    color: "#4f46e5"
    sections:
      - name: Days 1 to 30, learn
        tasks:
          - title: Meet every person on the team one to one
            due: +2w
            labels: [people]
            subtasks:
              - title: Ask what they wish the new person knew
          - title: Read the last three months of decisions
            due: +2w
            estimate: 120
          - title: Agree on 90-day goals with your manager
            priority: 1
            due: +3w
      - name: Days 31 to 60, contribute
        tasks:
          - title: Ship a first small improvement
            priority: 2
            due: +6w
          - title: Write down what confused you in month one
            due: +5w
      - name: Days 61 to 90, lead
        tasks:
          - title: Propose one change to how the team works
            due: +11w
          - title: Review the goals with your manager
            priority: 1
            due: +12w
            labels: [people]
