# Weekly review: a template of the OpenTodo library (templates/README.md). Licence: CC BY 4.0.
title: Weekly review
summary: A thirty-minute Friday ritual that empties your inboxes, looks back at the week and plans the next one.
description: |
  A weekly review keeps a task list trustworthy. Once a week you get everything out of your head, look at what happened, and decide what matters next.

  This template gives you a project with three sections that repeat [every Friday](https://open-todo.app/docs/recurrence/). Each task carries a small estimate, so the whole review fits in about thirty minutes on the [Day and Week calendars](https://open-todo.app/docs/time-blocking/).

  Pair it with a saved view such as `@review & due <= today`, pinned to the sidebar, and you have a review dashboard in one click. The [filters guide](https://open-todo.app/docs/filters/) explains the query language.
howToUse:
  - Start the template; the review repeats every Friday with small estimates, about thirty minutes in all.
  - "Save a view `@review & due <= today` and pin it: on Friday it is your checklist."
  - "Work through the three sections in order: get clear, look back, look ahead."
makeItYours:
  - Move it to the day your week actually ends.
  - "Add your own inboxes to the first section: a notebook, a chat app, a desk drawer."
  - Cut anything that does not earn its minutes after a month.
category: method
icon: book-open
layout: list
author: OpenTodo
reviewed: 2026-10-15
docs:
  - recurrence.md
  - filters.md
  - views.md
labels:
  - name: review
projects:
  - name: Weekly review
    color: "#059669"
    sections:
      - name: Get clear
        tasks:
          - title: Empty the inbox
            due: +0d
            time: 16:00
            recurrence: every friday
            estimate: 10
            labels: [review]
            subtasks:
              - title: Paper notes and receipts
              - title: Email flagged for follow-up
              - title: Inbox in OpenTodo
          - title: Close open loops from meetings
            due: +0d
            recurrence: every friday
            estimate: 5
            labels: [review]
      - name: Look back
        tasks:
          - title: Skim what you completed this week
            due: +0d
            recurrence: every friday
            estimate: 5
            labels: [review]
          - title: Reschedule or drop anything overdue
            due: +0d
            recurrence: every friday
            estimate: 5
            labels: [review]
      - name: Look ahead
        tasks:
          - title: Check next week's calendar
            due: +0d
            recurrence: every friday
            estimate: 5
            labels: [review]
          - title: Pick three priorities for next week
            priority: 1
            due: +0d
            recurrence: every friday
            estimate: 5
            labels: [review]
