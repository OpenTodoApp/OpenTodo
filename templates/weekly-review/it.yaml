sourceHash: sha-0853977b9182
title: "Revisione settimanale"
summary: "Un rituale del venerdì di trenta minuti che svuota le inbox, guarda indietro alla settimana e pianifica la prossima."
description: "Una revisione settimanale mantiene affidabile una lista di attività. Una volta a settimana togli tutto dalla testa, guardi cosa è successo e decidi cosa conta adesso.\n\nQuesto modello ti dà un progetto con tre sezioni che si ripetono [ogni venerdì](https://open-todo.app/docs/recurrence/). Ogni attività ha una piccola stima, così l'intera revisione sta in circa trenta minuti nei [calendari giornaliero e settimanale](https://open-todo.app/docs/time-blocking/).\n\nAbbinalo a una vista salvata come `@revisione & due <= today`, fissata nella barra laterale, e hai una dashboard di revisione a un clic. La [guida ai filtri](https://open-todo.app/docs/filters/) spiega il linguaggio delle query.\n"
howToUse.0: "Avvia il modello; la revisione si ripete ogni venerdì con piccole stime, circa trenta minuti in tutto."
howToUse.1: "Salva una vista `@revisione & due <= today` e fissala: il venerdì è la tua lista di controllo."
howToUse.2: "Segui le tre sezioni in ordine: fare chiarezza, guardare indietro, guardare avanti."
makeItYours.0: "Spostala al giorno in cui finisce davvero la tua settimana."
makeItYours.1: "Aggiungi le tue inbox alla prima sezione: un quaderno, una chat, un cassetto della scrivania."
makeItYours.2: "Dopo un mese, togli quello che non vale i suoi minuti."
