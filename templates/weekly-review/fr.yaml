sourceHash: sha-0853977b9182
title: "Revue hebdomadaire"
summary: "Un rituel du vendredi de trente minutes pour vider les boîtes de réception, faire le bilan de la semaine et planifier la suivante."
description: "Une revue hebdomadaire garantit la fiabilité d’une liste de tâches. Une fois par semaine, tu te vides la tête, tu examines ce qui s’est passé et tu décides de ce qui compte maintenant.\n\nCe modèle te fournit un projet avec trois sections qui se répètent [chaque vendredi](https://open-todo.app/docs/recurrence/). Chaque tâche comporte une petite estimation, de sorte que l’ensemble de la revue prend environ trente minutes dans les [calendriers quotidien et hebdomadaire](https://open-todo.app/docs/time-blocking/).\n\nAssocie-le à une vue enregistrée telle que `@revue & due <= today`, épinglée dans la barre latérale, et tu obtiendras un tableau de bord de revue en un clic. Le [guide des filtres](https://open-todo.app/docs/filters/) explique le langage des requêtes.\n"
howToUse.0: "Lance le modèle ; la revue se répète chaque vendredi avec de petites estimations, environ trente minutes au total."
howToUse.1: "Enregistre une vue `@revue & due <= today` et épingle-la : le vendredi, c’est ta liste de contrôle."
howToUse.2: "Suis les trois sections dans l’ordre : vider la tête, faire le bilan, regarder vers l’avenir."
makeItYours.0: "Déplace-la au jour où se termine réellement ta semaine."
makeItYours.1: "Ajoute tes boîtes de réception à la première section : un carnet, une messagerie, un tiroir de bureau."
makeItYours.2: "Au bout d’un mois, supprime ce qui ne mérite pas d’y consacrer du temps."
