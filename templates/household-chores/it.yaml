title: "Faccende di casa"
summary: "Faccende quotidiane, settimanali e mensili che si ripetono, pronte da condividere e assegnare in famiglia."
description: "Le faccende sono il motivo per cui molte famiglie vogliono una lista condivisa. Ogni attività qui si [ripete](https://open-todo.app/docs/recurrence/) con la sua cadenza, e quando ne completi una compare la successiva.\n\n[Condividi il progetto](https://open-todo.app/docs/sharing/) con chi vive con te e assegna le attività alle persone, o lasciale libere per chi arriva prima.\n"
howToUse.0: "Avvia il modello, poi condividi il progetto con chi vive con te come editor."
howToUse.1: "Assegna ogni faccenda a una persona, o lasciala libera per chi arriva prima."
howToUse.2: "Spunta una faccenda e la successiva compare secondo la sua cadenza."
makeItYours.0: "Cambia i giorni: la tua raccolta differenziata può passare il martedì, non il giovedì."
makeItYours.1: "Dividi il progetto in sezioni per stanza o per persona e mostralo come bacheca."
makeItYours.2: "Aggiungi etichette come `@10min` per riempire un momento libero dalla lista."
