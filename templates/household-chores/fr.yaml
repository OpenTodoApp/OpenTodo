title: "Tâches ménagères"
summary: "Tâches quotidiennes, hebdomadaires et mensuelles récurrentes, prêtes à être partagées et assignées au sein du foyer."
description: "Les tâches ménagères sont la raison pour laquelle de nombreux foyers souhaitent une liste partagée. Chaque tâche ici se [répète](https://open-todo.app/docs/recurrence/) selon sa propre fréquence, et lorsque tu en termines une, la suivante apparaît.\n\n[Partage le projet](https://open-todo.app/docs/sharing/) avec les personnes qui vivent avec toi et attribue les tâches, ou laisse-les libres pour le premier disponible.\n"
howToUse.0: "Lance le modèle, puis partage le projet avec les personnes qui vivent avec toi en tant qu'éditeurs."
howToUse.1: "Attribue chaque tâche ménagère à une personne, ou laisse-la libre pour le premier disponible."
howToUse.2: "Coche une tâche et la suivante apparaît selon sa fréquence."
makeItYours.0: "Change les jours : le tri sélectif passe peut-être le mardi chez toi, et non le jeudi."
makeItYours.1: "Divise le projet en sections par pièce ou par personne et affiche-le sous forme de tableau."
makeItYours.2: "Ajoute des étiquettes comme `@10min` pour occuper un moment libre à partir de la liste."
