# Household chores: a template of the OpenTodo library (templates/README.md). Licence: CC BY 4.0.
title: Household chores
summary: Daily, weekly and monthly chores on repeat, ready to share and assign in a household.
description: |
  Chores are the reason many households want a shared task list. Every task here [repeats](https://open-todo.app/docs/recurrence/) on its own schedule, and when you complete one the next occurrence appears.

  [Share the project](https://open-todo.app/docs/sharing/) with everyone at home and assign tasks to people, or leave them open for whoever gets there first.
howToUse:
  - Start the template, then share the project with everyone at home as editors.
  - Assign each chore to a person, or leave it open for whoever gets there first.
  - Tick a chore off and its next occurrence appears on its schedule.
makeItYours:
  - "Change the days: your bins may go out on Tuesday, not Thursday."
  - Split the project into sections by room or by person and show it as a board.
  - Add labels like `@10min` so a short gap can be filled from the list.
category: home
icon: house
layout: list
author: OpenTodo
reviewed: 2026-10-15
docs:
  - recurrence.md
  - sharing.md
labels:
  - name: kitchen
  - name: cleaning
  - name: garden
projects:
  - name: Household
    color: "#16a34a"
    sections:
      - name: Daily
        tasks:
          - title: Load or empty the dishwasher
            due: +0d
            recurrence: every day
            labels: [kitchen]
          - title: Wipe the kitchen counters
            due: +0d
            recurrence: every day
            labels: [kitchen]
      - name: Weekly
        tasks:
          - title: Vacuum and mop
            due: +0d
            recurrence: every saturday
            estimate: 45
            labels: [cleaning]
          - title: Change the bed sheets
            due: +0d
            recurrence: every sunday
            labels: [cleaning]
          - title: Take out recycling
            due: +0d
            recurrence: every tuesday
          - title: Water the plants
            due: +0d
            recurrence: every wednesday and saturday
            labels: [garden]
      - name: Monthly
        tasks:
          - title: Clean the fridge
            due: +1w
            recurrence: every month
            labels: [kitchen]
          - title: Descale the kettle and coffee machine
            due: +2w
            recurrence: every month
            labels: [kitchen]
          - title: Test the smoke alarms
            due: +3w
            recurrence: every month
