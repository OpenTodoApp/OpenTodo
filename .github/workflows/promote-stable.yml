name: Promote stable

# Points ghcr.io/<repo>:stable, the tag every platform template names (OpenSpec
# stable-image-tag), at an already published release, without rebuilding it.
# Releases move `stable` by themselves; run this once to create it, or to roll back.
#
# After the move to OpenTodoApp (deploy/deploy.json `legacy`): a release published only
# under the legacy name ghcr.io/pixari/opentodo (0.14.2 and earlier) is first copied to
# ghcr.io/opentodoapp/opentodo with its signatures, digest unchanged. Through the 0.16
# releases, the legacy name's `stable` moves too (secret GHCR_LEGACY_TOKEN when it is set;
# a refused push is a warning).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release to point stable at, for example 0.6.1 (no leading v, no pre-release)
        required: true

permissions:
  contents: read
  packages: write

# One promotion at a time; a second one waits instead of racing the first.
concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Point stable at ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 0.6.1 (no v, no pre-release suffix)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy a release from before the move
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          LEGACY=$(jq -r .legacy.image deploy/deploy.json)
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1 || [ "$IMAGE" = "$LEGACY" ]; then
            echo "$IMAGE:$VERSION is published"; exit 0
          fi
          # cosign copy keeps the index byte for byte (same digest) and brings its signatures along.
          if ! cosign copy "$LEGACY:$VERSION" "$IMAGE:$VERSION"; then
            echo "::warning::cosign copy failed; copying $LEGACY:$VERSION without its signatures (verify it under the legacy name)"
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$LEGACY:$VERSION"
          fi
      - name: Retag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:stable"
      - name: Retag the legacy name
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          scripts/legacy-image.sh check "$VERSION" || exit 0
          scripts/legacy-image.sh login
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          scripts/legacy-image.sh image "$IMAGE:$VERSION" stable
