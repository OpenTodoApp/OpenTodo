name: Promote stable

# Points ghcr.io/<repo>:stable, the tag every platform template names (OpenSpec
# stable-image-tag), at an already published release, without rebuilding it.
# Releases move `stable` by themselves; run this once to create it, or to roll back.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release to point stable at, for example 0.6.1 (no leading v, no pre-release)
        required: true

permissions:
  contents: read
  packages: write

# One promotion at a time; a second one waits instead of racing the first.
concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Point stable at ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 0.6.1 (no v, no pre-release suffix)"; exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:stable"
