name: Nightly retry

# Re-runs a nightly run once when its only failures are jobs GitHub never gave a
# runner ("The job was not acquired by Runner of type hosted even after multiple
# attempts": a hosted runner shortage, most often macOS). The re-run attempt runs
# the nightly alert again, which then reports as usual; a second attempt is never
# retried, and a job that failed on a runner is never re-run (scripts/nightly-retry.sh).
on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry jobs that never got a runner
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Re-run when only jobs without a runner failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if scripts/nightly-retry.sh check "$RUN_ID" 1; then
            scripts/nightly-retry.sh rerun "$RUN_ID"
          else
            echo "a job failed with a runner; nothing to retry"
          fi
