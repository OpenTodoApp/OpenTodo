name: Performance

# The time benchmark of the performance budgets (OpenSpec change performance-10k,
# docs/performance.md): the 10,000-task account, every server, desktop and
# phone-profile budget five times, the median against scripts/perf/budgets.json.
# Too slow and too noisy for every pull request (those run the count checks of the
# web scale tests and internal/perfseed): it runs on pull requests that change the
# benchmark itself and on demand, and is called by the nightly workflow (whose alert
# names the metrics over budget) once every budget holds.
on:
  workflow_call:
    outputs:
      failures:
        description: The metrics over budget, one per line
        value: ${{ jobs.perf.outputs.failures }}
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/perf/**"
      - "internal/perf/**"
      - "internal/perfseed/**"
      - "cmd/perfseed/**"
      - ".github/workflows/perf.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    name: Performance budgets (10,000 tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # The pinned Playwright image (as the layout check): Chromium and its packages.
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      GOFLAGS: -buildvcs=false
    outputs:
      failures: ${{ steps.report.outputs.failures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      # The library only: the image's browsers (PLAYWRIGHT_BROWSERS_PATH) match its version.
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      - name: Measure every budget five times
        run: scripts/perf/run.sh
      - name: Name what is over budget
        id: report
        if: always()
        run: |
          {
            echo 'failures<<PERF_EOF'
            cat perf-report/failures.txt 2>/dev/null || echo "the benchmark did not finish"
            echo 'PERF_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report
          path: |
            perf-report/*.json
            perf-report/*.txt
            perf-report/*.png
          retention-days: 30

  # The 50,000-task account (proposal "Out of scope"): measured and reported, never
  # held to a budget. One run, desktop and server.
  perf-50k:
    name: Performance at 50,000 tasks (reported only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      - name: Measure once (reported, not gated)
        env:
          PERF_SEED_FLAGS: -scale 5
          PERF_RUNS: "1"
          PERF_PROFILES: desktop
        run: scripts/perf/run.sh || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report-50k
          path: |
            perf-report/*.json
            perf-report/*.txt
          retention-days: 30
