name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: internal/web/dist
          include-hidden-files: true

  server:
    name: Server (vet, test, build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      - name: Smoke test the binary
        run: |
          OPENTODO_DATA_DIR=/tmp/ot ./bin/opentodo &
          sleep 1
          ./bin/opentodo healthcheck
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          kill %1
      - name: Build the CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/ot ./cmd/ot
      - name: Smoke test the CLI against a local server
        run: ./scripts/cli-smoke.sh | tee /dev/stderr | grep -q '^CLI OK$'

  # Opens every screen and overlay at 360/390/768 px, light and dark, in Chromium
  # and WebKit (Safari's engine) and fails on sideways scrolling, overlays or
  # close buttons off screen, overlays that do not close, and touch targets
  # under 44 px (OpenSpec change mobile-layout). Screenshots of failures are
  # uploaded as the layout-report artifact.
  layout:
    name: Layout check (Chromium, WebKit)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      - name: Install Playwright with Chromium and WebKit
        run: |
          npm i -g playwright@1.56.1
          playwright install --with-deps chromium webkit
      - name: Run the layout check against a fresh server
        run: |
          OPENTODO_DATA_DIR=$(mktemp -d) ./bin/opentodo &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 0.5; done
          node scripts/e2e-layout.mjs layout-report
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: layout-report
          path: layout-report

  cli:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-compile ot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/ot-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/ot
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - name: Cross-compile the server (web app embedded)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/opentodo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/opentodo
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  extension:
    name: Browser extension (test, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Runs the unit tests, refuses a manifest with host permissions and zips extension/.
      - run: make extension
      - uses: actions/upload-artifact@v7
        with:
          name: opentodo-browser-extension
          path: dist/opentodo-browser-extension.zip

  openspec:
    name: OpenSpec (validate specs and changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @fission-ai/openspec@latest validate --all --strict

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, openspec]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One job publishes the GitHub release for a v* tag, after everything it ships
  # has built: server and `ot` binaries for every platform, the extension zip and
  # SHA256SUMS. Notes come from the tag's section in CHANGELOG.md.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [cli, extension, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'opentodo-*' -o -name 'ot-*' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          # The release may already exist when it was created in the GitHub UI (which
          # also creates the tag): then title, notes and the pre-release flag are set
          # from CHANGELOG.md here, so nothing has to be typed there.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "OpenTodo $GITHUB_REF_NAME" --notes-file notes.md $pre
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "OpenTodo $GITHUB_REF_NAME" --notes-file notes.md $pre
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
