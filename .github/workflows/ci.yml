name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  # A pull request runs the fast tier (ci-pr-fast-tier, ci-pr-shorter-chain): the checks, web,
  # server, image and the small packages; the browser, workbench, accessibility, phone, binary
  # and site bundle jobs wait for the queue.
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue: the whole path tier, the heavy jobs included, on the
  # pull request merged onto the queue's base. Its "CI result" is the gate to main.
  merge_group:
  # The full matrix every night and on demand; pushes to main run the path tier without the heavy jobs.
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: Run the path tier (heavy jobs included) against this branch, for example main (empty runs every job)
        required: false
        default: ''

permissions:
  contents: read

# One run per ref and event (OpenSpec ci-release-gates): a new push to a pull request
# or to main cancels the running checks of the one before; release tags, the nightly
# and a run started by hand always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  OPENSPEC_TELEMETRY: "0"

# Every action is pinned to a full commit SHA with its release in a comment, every
# job has a timeout, and container images are pinned by digest (OpenSpec
# ci-release-gates; scripts/repo-checks.test.mjs checks all three). Dependabot
# (.github/dependabot.yml) proposes the updates.
jobs:
  # Tiered CI (OpenSpec ci-speed, ci-pr-fast-tier; path filter from site-bundle D7, no
  # third-party action). The path tier: the checks, and for code the web, server and image
  # jobs and one linux/amd64 binary; one Chromium layout and end-to-end job when `layout`
  # paths changed; the workbench checks when `ui` paths changed; Android, extension,
  # Obsidian plugin and skill only for their own paths; a docs-only change runs the checks
  # and the docs website. The merge queue runs the whole path tier for what it changes;
  # a pull request, draft or not, and a push to main run it without the browser,
  # workbench, accessibility and phone jobs, which the queue runs before anything lands;
  # a pull request also skips the binary and site bundle jobs (ci-pr-shorter-chain).
  # Release tags, the nightly schedule and a run by hand run every job and every matrix
  # leg (`full`, every output true). The interface audit runs nightly (ux-audit.yml).
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      mobile: ${{ steps.filter.outputs.mobile }}
      ui: ${{ steps.filter.outputs.ui }}
      layout: ${{ steps.filter.outputs.layout }}
      a11y: ${{ steps.filter.outputs.a11y }}
      extension: ${{ steps.filter.outputs.extension }}
      obsidian: ${{ steps.filter.outputs.obsidian }}
      skill: ${{ steps.filter.outputs.skill }}
      ios: ${{ steps.filter.outputs.ios }}
      # Every job and every matrix leg: release tags, the nightly and a run by hand.
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The path filter's table of cases, the shared Go toolchain and the compose
      # defaults (OpenSpec release-hygiene).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/repo-checks.test.mjs
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          # The merge queue runs the whole path tier for what the queued change adds.
          if [ "$EVENT" = "merge_group" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            git diff --name-only "$QUEUE_BASE" HEAD > changed.txt
            cat changed.txt
            ./scripts/ci-changes.sh < changed.txt >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push to main runs the path tier for what it changed since the commit before,
          # without the browser, workbench, accessibility and phone jobs: the merge queue
          # ran them on this same tree before it landed (ci-pr-fast-tier). The image,
          # its publishing and "CI result" still run. A push that cannot be compared (a new
          # branch) runs everything; the nightly runs every job on main.
          if [ "$EVENT" = "push" ] && [ "${REF#refs/tags/}" = "$REF" ] && [ -n "$BEFORE" ] \
            && ! printf '%s' "$BEFORE" | grep -Eq '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            git diff --name-only "$BEFORE" HEAD > changed.txt
            cat changed.txt
            ./scripts/ci-changes.sh < changed.txt | sed -E 's/^(ui|layout|a11y|mobile|ios)=true$/\1=false/' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A run by hand with a base: the path tier against it. The UI baselines fold
          # starts one for its pull request, which the workflow's token opened without a run.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$DISPATCH_BASE" ]; then
            printf '%s' "$DISPATCH_BASE" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "::error::base must be a branch name"; exit 1; }
            git fetch -q origin "$DISPATCH_BASE"
            echo "full=false" >> "$GITHUB_OUTPUT"
            git diff --name-only FETCH_HEAD...HEAD > changed.txt
            cat changed.txt
            ./scripts/ci-changes.sh < changed.txt >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            for k in code docs mobile ui layout a11y extension obsidian skill ios; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          echo "full=false" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE"...HEAD > changed.txt
          cat changed.txt
          # The fast tier: the checks, web, server, image and the small packages. The
          # browser, workbench, accessibility and phone jobs run in the merge queue.
          ./scripts/ci-changes.sh < changed.txt | sed -E 's/^(ui|layout|a11y|mobile|ios)=true$/\1=false/' >> "$GITHUB_OUTPUT"

  # The web app is built in its own job (ci-speed): the server, layout and binary
  # jobs need only web-dist, so they start while the unit tests still run. On a pull
  # request the server is its only consumer, so the server job builds it there
  # (ci-pr-server-builds-web).
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Not on pull requests (ci-pr-server-builds-web): there the server job, its one consumer,
    # builds the web app itself instead of waiting for this job's runner.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # Build, bundle budget and the tests of the built app (scripts/ci-web-build.sh).
      - run: ./scripts/ci-web-build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/web/dist
          include-hidden-files: true

  # Signs the web app's file list (OpenSpec signed-web-app D4): release tags only, the
  # only job in the protected `web-signing` environment (its required reviewer approves
  # every signing) and the only one that reads WEB_SIGNING_KEY. It signs the build of
  # web-build, after checking every file against the list and the version against the
  # tag, and hands it on as web-dist-signed, which the binaries and the image embed.
  # Without the secret (a fork, or before the keys exist) it passes the build on
  # unsigned, so the release reads "Self-built" and stays green.
  web-sign:
    name: Web app signature
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, web-build]
    environment: web-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - name: Sign the file list
        env:
          WEB_SIGNING_KEY: ${{ secrets.WEB_SIGNING_KEY }}
        run: |
          if [ -z "$WEB_SIGNING_KEY" ]; then
            echo "::warning::WEB_SIGNING_KEY is not set in the web-signing environment: this release is not signed and reads Self-built."
            go run ./cmd/websign verify internal/web/dist
          else
            go run ./cmd/websign sign -version "$GITHUB_REF_NAME" internal/web/dist
            go run ./cmd/websign verify -require-signed internal/web/dist
          fi
          mkdir -p web-manifest
          cp internal/web/dist/app-manifest.json "web-manifest/opentodo-web-manifest-${GITHUB_REF_NAME}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-signed
          path: internal/web/dist
          include-hidden-files: true
      # The public record of what this version's code is, attached to the release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-manifest
          path: web-manifest

  web:
    name: Web (${{ matrix.shard == 1 && 'typecheck, lint, ' || '' }}test ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The unit tests in three shards: on one runner they took 5.5 to 8.5 minutes,
    # the longest step of every pull request. Typecheck and lint run in the first shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        if: matrix.shard == 1
        working-directory: web
      - name: React hooks lint (make web-lint)
        if: matrix.shard == 1
        run: npm run lint
        working-directory: web
      - run: npm test -- --shard="$SHARD/3"
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}

  web-scale:
    # The scale tests (*.perf.test.tsx: lists of 2,000 rows, the 10,000-task account of
    # performance-10k) on a runner of their own, beside the web job: in the parallel
    # unit pool they raced every other file and timed out under load (test audit F4).
    # They assert counts, not times.
    name: Web scale tests (10,000 tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run test:perf
        working-directory: web

  server:
    name: Server (vet, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, web-build]
    # web-build is skipped on pull requests; this job then builds the web app itself.
    if: ${{ !cancelled() && !failure() && needs.web-build.result != 'cancelled' && needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Node for the web build on pull requests and the sync client contract tests below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'pull_request'
        with:
          name: web-dist
          path: internal/web/dist
      # Then node_modules goes again: `./...` below would include the Go code some npm
      # packages ship, and the contract tests install it afresh after the Go steps.
      - name: Web build (pull requests; elsewhere the web-build job)
        if: github.event_name == 'pull_request'
        run: |
          (cd web && npm ci --no-audit --no-fund)
          ./scripts/ci-web-build.sh
          rm -rf web/node_modules
      - name: Toolchain matches go.mod (patched release toolchain)
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          go version | grep -q " $want " || { go version; echo "expected the go.mod toolchain $want"; exit 1; }
      - run: go vet ./...
      - name: staticcheck (version pinned in the Makefile)
        run: make staticcheck
      # Fails on vulnerabilities the code can reach (OpenSpec release-hygiene).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test ./...
      # Shows whether the Multipath TCP check ran or skipped on this runner's kernel.
      - name: Multipath TCP is off (CVE-2026-98432)
        run: go test ./cmd/opentodo -run TestListenerHasNoMultipathTCP -v -count=1
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      - name: Smoke test the binary
        run: |
          OPENTODO_DATA_DIR=/tmp/ot ./bin/opentodo &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 0.5; done
          ./bin/opentodo healthcheck
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          kill %1
      - name: Build the CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/ot ./cmd/ot
      - name: Smoke test the CLI against a local server
        run: ./scripts/cli-smoke.sh | tee /dev/stderr | grep -q '^CLI OK$'
      # The web app's sync client (src/lib) against this server binary, no mocks
      # (OpenSpec self-hosting "The sync client is tested against the server").
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Sync client contract tests (against bin/opentodo)
        run: npm run test:contract
        working-directory: web

  # Opens every screen and overlay at 360/390/768 px, light and dark, in Chromium
  # and WebKit (Safari's engine) and fails on sideways scrolling, overlays or
  # close buttons off screen, overlays that do not close, and touch targets
  # under 44 px (OpenSpec change mobile-layout). Every screen and overlay, in
  # light and dark, and the docs website are also checked with axe-core
  # (serious and critical issues fail). Screenshots of failures are uploaded as the
  # layout-report-<engine>-<n> artifact. The End-to-end leg runs the browser end-to-end
  # checks instead: two devices, an offline edit converging, the PWA, an offline start,
  # inbox triage and saved views (`make e2e`). One job per engine and width, side by
  # side; each builds its own server binary and only needs the web build.
  # Every Playwright job runs in the pinned Playwright image, whose browsers and their
  # system packages are preinstalled: nothing comes from the runner's apt mirror, which
  # sometimes serves a job at a few kB/s (v0.15.0 and main runs failed on it).
  layout:
    name: Layout check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, web-build]
    if: needs.changes.outputs.layout == 'true'
    strategy:
      fail-fast: false
      # A pull request and a push to main run three legs side by side: Chromium at every width in
      # English, split in two (SHARD: the light combinations, then the end-to-end checks; and the
      # dark ones), and the safe-area check (about 6, 7 and 7 minutes). Tags, the nightly and a run by hand run one leg per
      # engine, width and the German and French catalogs, and the end-to-end checks beside them.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.full != 'true' && '[{"engine":"chromium","name":"Chromium, all widths, 1/2, end-to-end","widths":"360,390,768","shard":"1/2","e2e":true},{"engine":"chromium","name":"Chromium, all widths, 2/2","widths":"360,390,768","shard":"2/2"},{"engine":"chromium","name":"Safe area","safearea":true}]' || '[{"engine":"chromium","name":"Chromium 360 px","widths":"360"},{"engine":"chromium","name":"Chromium 390 px","widths":"390"},{"engine":"chromium","name":"Chromium 768 px","widths":"768"},{"engine":"chromium","name":"End-to-end","e2e":true},{"engine":"chromium","name":"Safe area","safearea":true},{"engine":"webkit","name":"WebKit 360 px","widths":"360"},{"engine":"webkit","name":"WebKit 390 px","widths":"390"},{"engine":"webkit","name":"WebKit 768 px","widths":"768"},{"engine":"chromium","name":"Chromium 360 px German","widths":"360","lang":"de"},{"engine":"chromium","name":"Chromium 360 px French","widths":"360","lang":"fr"}]') }}
    # The pinned Playwright image (PLAYWRIGHT_IMAGE in the Makefile): Chromium, WebKit and
    # their system packages are in it. The server is a static Go build made in the job.
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    # The checkout belongs to the runner's user, not the container's root, so Go cannot
    # read its VCS status (nothing uses the stamp).
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      # axe-core for the accessibility checks (web devDependency).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # The library only: the image's browsers (PLAYWRIGHT_BROWSERS_PATH) match its version.
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      - name: Run the layout check against a fresh server
        if: ${{ matrix.widths }}
        env:
          ENGINES: ${{ matrix.engine }}
          WIDTHS: ${{ matrix.widths }}
          OPENTODO_LANG: ${{ matrix.lang }}
          SHARD: ${{ matrix.shard }}
        run: |
          OPENTODO_DATA_DIR=$(mktemp -d) ./bin/opentodo &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 0.5; done
          node scripts/e2e-layout.mjs layout-report
      # The run above has the phone screens below 768 px, as a phone has by default (OpenSpec
      # phone-ui-default), and fails when a screen has neither the phone header nor a phone screen.
      # This one turns the device's switch off: the earlier phone layout, for as long as it is the
      # way back. On a second fresh server, since the check creates the owner account. Phone widths
      # only (at 768 px the switch changes nothing), split as the leg is.
      - name: Layout check with the earlier phone screens
        if: ${{ matrix.widths && matrix.widths != '768' && !matrix.lang }}
        env:
          ENGINES: ${{ matrix.engine }}
          WIDTHS: ${{ matrix.widths == '360,390,768' && '360,390' || matrix.widths }}
          PHONE_UI: "0"
          SHARD: ${{ matrix.shard }}
          OPENTODO_URL: http://127.0.0.1:8081
        run: |
          OPENTODO_ADDR=127.0.0.1:8081 OPENTODO_DATA_DIR=$(mktemp -d) ./bin/opentodo &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8081/healthz >/dev/null && break; sleep 0.5; done
          node scripts/e2e-layout.mjs layout-report/earlier-phone
      # The safe-area check (GitHub issue 973): every screen and overlay as the installed app
      # on a phone with a Dynamic Island, portrait and landscape, insets emulated.
      - name: Safe-area check against a fresh server
        if: ${{ matrix.safearea }}
        run: |
          OPENTODO_DATA_DIR=$(mktemp -d) ./bin/opentodo &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 0.5; done
          node scripts/e2e-safe-area.mjs layout-report
      # What `make e2e` runs (the image has no make).
      - name: End-to-end (two devices, offline sync, offline start, inbox triage, saved views)
        if: ${{ matrix.e2e }}
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/ot ./cmd/ot
          scripts/e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: layout-report-${{ matrix.engine }}-${{ strategy.job-index }}
          path: layout-report

  # The interface audit (OpenSpec web-app "Interface audit tour") runs in its own
  # workflow, .github/workflows/ux-audit.yml: on pull requests and nightly, off the
  # push critical path (ci-speed).

  # The accessibility gate on real screens (OpenSpec accessibility "Accessibility gate on
  # real screens", change accessibility-aa D1): every entry of the screen inventory against
  # a seeded server at 360 and 1280 px, light and dark, English; fails on any serious or
  # critical axe violation and on the measured criteria (focus visible and not obscured,
  # WCAG target size, reflow at 320 px, text spacing, credential fields). Two shards of the
  # inventory side by side; the nightly Interface audit runs the full matrix.
  a11y-screens:
    name: Accessibility (screens ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, web-build]
    if: needs.changes.outputs.a11y == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      # axe-core (web devDependency).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      - name: Measurement tests (fixtures in Chromium)
        if: matrix.shard == 1
        run: node --test scripts/ux-audit/measure.test.mjs
      - name: Accessibility gate (every screen, 360 and 1280 px, light and dark)
        env:
          A11Y_ONLY: "1"
          WIDTHS: 360,1280
          LANGS: en
          SHARD: ${{ matrix.shard }}/2
          CONCURRENCY: 2
          OUT_DIR: a11y-report
        run: node scripts/ux-audit/tour.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: a11y-report-${{ matrix.shard }}
          path: a11y-report

  # The docs website (user-documentation): no sideways scrolling at 360/390/1280 px,
  # axe-core without serious or critical issues, search, and pages without JavaScript.
  # Its own job so docs-only changes run it without the server and layout jobs.
  docs-site:
    name: Docs website (browser check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    # The pinned Playwright image, like the layout check.
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # axe-core for the accessibility checks (web devDependency).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      - run: node scripts/e2e-docs.mjs docs-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-report
          path: docs-report

  # The site bundle (OpenSpec site-bundle): docs site, screenshots, tokens, icons,
  # changelog and manifest for the website repository. Every run outside pull requests
  # uploads it as an artefact (a preview of unreleased docs); a v* tag names it after the tag and the
  # release job attaches it. The manifest's import formats come from the linux/amd64
  # server binary when the binaries were built, otherwise from `go run`.
  site-bundle:
    name: Site bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, cli]
    # Not on pull requests (ci-pr-shorter-chain): it waits for the binaries and catches
    # nothing the docs check misses there; the merge queue builds it before a change lands.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.cli.result != 'failure' && needs.changes.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.cli.result == 'success'
        with:
          name: bin-linux-amd64
          path: bin-linux
      - name: Build the bundle
        id: bundle
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="$GITHUB_REF_NAME" ;;
            *) version="main-$(git rev-parse --short HEAD)" ;;
          esac
          bin=""
          if [ -f bin-linux/opentodo-linux-amd64 ]; then chmod +x bin-linux/opentodo-linux-amd64; bin="--bin bin-linux/opentodo-linux-amd64"; fi
          node scripts/site-bundle.mjs --version "$version" $bin
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-site-bundle-${{ steps.bundle.outputs.version }}
          path: dist/opentodo-site-bundle-${{ steps.bundle.outputs.version }}.tar.gz
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  # Design workbench gates (OpenSpec design-language): every Storybook story in light
  # and dark is checked with axe-core (WCAG 2.2 AA, serious and critical fail) and
  # compared with the committed baselines in web/src/ui/__screenshots__ (375 and
  # 1280 px). Baselines come from the pinned Playwright image: `make ui-baselines`
  # or the "UI baselines" workflow. The two gates run as separate jobs, and the
  # visual comparison is split into three shards (Playwright --shard) that run side
  # by side; every part must pass. Diffs are uploaded as ui-check-report-<shard>.
  # The design workbench, built once for the five UI check shards below (ci-speed): each
  # shard built the same Storybook again, about a minute apiece. Built in the same pinned
  # Playwright image the shards run in, so its output is what they built before.
  ui-storybook:
    name: UI check (workbench build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build-storybook
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: web/storybook-static
          retention-days: 1

  ui-a11y:
    name: UI check (workbench a11y ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ui-storybook]
    if: needs.changes.outputs.ui == 'true'
    # Split in two like the visual comparison (ci-speed); every part must pass.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      # axe-core (a web devDependency) for the check; the workbench comes built.
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: web/storybook-static
      - name: Accessibility (axe-core on every story, light and dark)
        env:
          SHARD: ${{ matrix.shard }}/2
        run: node scripts/ui-check/a11y.mjs
      - name: Motion (Foundations/Motion under reduced motion and no motion)
        if: matrix.shard == 1
        run: node scripts/ui-check/motion.mjs

  ui-visual:
    name: UI check (visual regression ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ui-storybook]
    if: needs.changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The same image `make ui-baselines` uses, so screenshots match the baselines
    # pixel for pixel. The baselines come from the ui-baselines branch, with this pull
    # request's new or changed ones in web/src/ui/__screenshots__ laid over them
    # (ui-baselines-branch). A missing or differing baseline fails the job; the
    # ui-check-report-<shard> artifact carries the *-actual.png images to commit there.
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm i -g --no-audit --no-fund playwright@1.56.1 @playwright/test@1.56.1
      # The workbench comes built; nothing here reads web's node_modules.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: web/storybook-static
      - name: Baselines
        run: node scripts/ui-check/baselines.mjs fetch
      - name: Visual regression
        working-directory: scripts/ui-check
        env:
          SHARD: ${{ matrix.shard }}
        # Every core (ci-speed): Playwright's default is half of them, and the screenshots are
        # CPU-bound; the same 346 stories took 2.9 min with 2 workers and 2.1 min with 4.
        run: NODE_PATH=$(npm root -g) playwright test -c playwright.config.ts --shard="$SHARD/3" --workers=100%
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-check-report-${{ matrix.shard }}
          path: |
            web/test-results/ui-visual
            web/playwright-report/ui-visual

  cli:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, server, web-sign]
    # web-sign runs on release tags only; elsewhere it is skipped, not failed. Not on pull
    # requests (ci-pr-shorter-chain): the server job builds the linux/amd64 binaries there,
    # and the merge queue cross-compiles before a change lands.
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64 on path-tier runs (the site bundle reads it); every platform on full runs.
        include: ${{ fromJSON(needs.changes.outputs.full != 'true' && '[{"goos":"linux","goarch":"amd64"}]' || '[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"},{"goos":"windows","goarch":"amd64","ext":".exe"},{"goos":"windows","goarch":"arm64","ext":".exe"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Toolchain matches go.mod (patched release toolchain)
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          go version | grep -q " $want " || { go version; echo "expected the go.mod toolchain $want"; exit 1; }
      - name: Cross-compile ot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: "0"
        # The version comes from the environment (GITHUB_REF_NAME), never from an
        # expression pasted into the script: a branch or tag name is not trusted text.
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/ot-${GOOS}-${GOARCH}${EXT}" ./cmd/ot
      # A release embeds the signed build (signed-web-app D4); anything else the plain one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'web-dist-signed' || 'web-dist' }}
          path: internal/web/dist
      - name: Cross-compile the server (web app embedded)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/opentodo-${GOOS}-${GOARCH}${EXT}" ./cmd/opentodo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  extension:
    name: Browser extension (test, package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Runs the unit tests, refuses a manifest with host permissions or a version
      # missing from extension/CHANGELOG.md, builds the Chrome and Firefox packages
      # and lints both with the web-ext version pinned in the Makefile.
      - run: make extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-browser-extension
          path: |
            dist/opentodo-browser-extension-chrome.zip
            dist/opentodo-browser-extension-firefox.zip

  # The Obsidian plugin (OpenSpec change obsidian-plugin): type-check, unit tests,
  # the build with its size budget and mobile check (make obsidian), the community
  # directory's checks on what the release repository receives (make
  # obsidian-review), then the plugin against a freshly built server (make obsidian-e2e). Runs for obsidian/
  # and the shared code it bundles (quick add, the envelope, the line vectors).
  obsidian:
    name: Obsidian plugin (test, build, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.obsidian == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            obsidian/package-lock.json
            obsidian/review/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: make obsidian
      - run: make obsidian-review
      - name: Server for the end-to-end check
        run: |
          (cd web && npm run build)
          make server
      - run: make obsidian-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-obsidian
          path: obsidian/dist

  # The Android app (OpenSpec change native-shells D9): unit tests, lint, the
  # AndroidX-only dependency check, translations and store metadata, a debug APK.
  # On tags, a release APK and AAB signed with the keystore from secrets (skipped
  # with a warning while the secrets are not set); the release job attaches them.
  # The AAB is the Google Play build, without location permissions (play-location-later),
  # checked by scripts/android-store-check.sh on every run.
  # Tags also prove the build reproducible (play-production D5): a second build in a
  # fresh checkout, compared with the first by scripts/android-repro.sh. The JDK is
  # pinned to the exact Temurin release named in mobile/README.md (D4).
  android:
    name: Android app (test, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21.0.13+9
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: make android
      # The two release builds (play-location-later): the AAB for Google Play is built with
      # -Popentodo.play=true and must not declare background (or any) location until Play
      # approves the declaration; the APK for GitHub and F-Droid keeps it. Both unsigned here;
      # tags check the signed ones again below.
      - name: Play AAB without location, APK with it
        run: |
          cd mobile/android
          ./gradlew --no-daemon -Popentodo.play=true :app:bundleRelease
          ./gradlew --no-daemon :app:assembleRelease
          cd ../..
          scripts/android-store-check.sh mobile/android/app/build/outputs/bundle/release/app-release.aab mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # Instrumented tests (native-shells 4.2–4.7) on one emulator: API 34, Google APIs
      # image (a current WebView), the AVD snapshot cached between runs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator snapshot (about 2 GB) is saved only by a run on main (the nightly run, or
      # one started by hand; pushes to main skip this job): a cache saved by a merge-queue run
      # belongs to that run's own ref, which no other run can read, and a few of those fill the
      # repository's cache quota and evict main's copy, so every queue run missed and built
      # the snapshot again. Saved after the tests booted from it, as the post-job save did.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Emulator snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Keep the emulator snapshot (main only)
        if: success() && steps.avd-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Failed instrumented tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          found = False
          for f in glob.glob('mobile/android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      found = True
                      msg = bad.get('message') or ((bad.text or '').strip().splitlines() or [''])[0]
                      print(f"::error title=Instrumented test failed::{case.get('classname')}.{case.get('name')}: {msg[:300]}")
          if not found:
              print('No failing test case in the JUnit results (the failure is outside the tests).')
          EOF
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-android-test-report
          path: |
            mobile/android/app/build/reports/androidTests/connected/
            mobile/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  # The signed Android release (tags only), in its own job so that the release
  # keystore can live in the `signing` environment, which the owner approves.
  android-sign:
    name: Android app (signed release)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [android]
    environment: signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21.0.13+9
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Signed release APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: no signed Android build for this release"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          cd mobile/android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          # The AAB is the Google Play build (play-location-later: no location permission until
          # Play approves background location); the APK for GitHub and F-Droid is the plain build,
          # the one F-Droid and the reproducible-build step below rebuild.
          OPENTODO_VERSION="$version" ./gradlew --no-daemon -Popentodo.play=true :app:bundleRelease
          OPENTODO_VERSION="$version" ./gradlew --no-daemon :app:assembleRelease
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/opentodo-android-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../dist/opentodo-android-$version.aab"
          ../../scripts/android-store-check.sh "../../dist/opentodo-android-$version.aab" "../../dist/opentodo-android-$version.apk"
          # The release certificate (play-production D1): the one documented in docs/android-app.md
          # and allowed in the F-Droid metadata, so Play, F-Droid and GitHub share one signature.
          cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "../../dist/opentodo-android-$version.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          want=$(grep -A1 '^AllowedAPKSigningKeys:' store/fdroid/app.opentodo.yml | grep -oE '[0-9a-f]{64}')
          printf '### Android release certificate\n\nSHA-256 `%s`\n' "$cert" >> "$GITHUB_STEP_SUMMARY"
          if [ "$cert" != "$want" ]; then
            if [ "$GITHUB_REPOSITORY" = "OpenTodoApp/OpenTodo" ]; then
              echo "::error::The APK is signed with $cert, not the release certificate $want (docs/android-app.md)"
              exit 1
            fi
            echo "::warning::The APK is signed with $cert, not OpenTodo's release certificate (a fork's own key)"
          fi
      - name: Reproducible build
        env:
          REPRO_CLEAN_CACHE: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/repro"
          "$RUNNER_TEMP/repro/bin/pip" install --quiet --require-hashes -r scripts/release/requirements-repro.txt
          export PATH="$RUNNER_TEMP/repro/bin:$PATH"
          apk="dist/opentodo-android-${GITHUB_REF_NAME#v}.apk"
          # Against the signed release APK when there is one, otherwise two unsigned builds.
          if [ -f "$apk" ]; then
            scripts/android-repro.sh "$GITHUB_REF_NAME" "$apk"
          else
            scripts/android-repro.sh "$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-android
          path: dist/opentodo-android-*
          if-no-files-found: warn

  # The iOS app (ios-shell). A macOS runner, because the shell is built and tested
  # with Xcode against a simulator; it starts only for iOS changes, since a macOS
  # minute costs ten Ubuntu ones. No Apple account is involved here: the last step is
  # the first half of the TestFlight upload (ios-distribution D9), an unsigned archive
  # with the newest Xcode signed ad hoc with the entitlements, so that path is checked
  # on every iOS change. The signed upload is the ios-testflight job below.
  ios:
    name: iOS (build and test)
    runs-on: macos-15
    timeout-minutes: 40
    needs: [changes]
    if: needs.changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `make ios` reads the version from `git describe --tags`; a shallow clone has none.
          fetch-tags: true
      - name: Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      # Measurement: between the end of the build and the first test, `make ios` waits 1.5 to
      # 9 minutes in silence. This boots the simulator the tests run on and prints how long it
      # took: the Makefile's iPhone under the newest runtime that has it, which is the one
      # `name=` chose (xcodebuild takes the latest OS), handed to `make ios` by its id so both
      # use the same device.
      - name: Boot the simulator, timed
        timeout-minutes: 15
        run: |
          sim=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*//; s/ (.*//; /^iPhone/p' | head -1)
          # The newest runtime, as xcodebuild's name= chose (iOS 26.2 with Xcode 16.4 in recent runs).
          udid=$(xcrun simctl list devices available -j | jq -r --arg n "$sim" '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS-"))
             | {v: (.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a|tonumber), (.b|tonumber)]), d: .value[]}
             | select(.d.name == $n)] | sort_by(.v) | last | .d.udid')
          [ -n "$udid" ] && [ "$udid" != null ] || { echo "no $sim simulator under an iOS runtime"; exit 1; }
          echo "simulator: $sim ($udid)"
          echo "SIM_ID=$udid" >> "$GITHUB_ENV"
          start=$(date +%s)
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "booted in $(( $(date +%s) - start )) s"
      - name: Unit tests, device build and the dependency check (make ios)
        run: make ios
      # A failed test's screenshots and its accessibility snapshot, which the log does not
      # carry (open the .xcresult in Xcode): xcodebuild writes the bundle under the derived data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-test-results
          path: mobile/ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive with the newest Xcode, signed ad hoc (the TestFlight job's first half)
        run: |
          scripts/release/ios-testflight.sh xcode
          make ios-archive

  # The agent skills (OpenSpec changes agent-ready-cli and claude-plugin): the CLI
  # skill that `ot skill` prints and the MCP skill, zipped as release assets.
  skill:
    name: Agent skill (package)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.skill == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make skill
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-agent-skill
          path: |
            dist/opentodo-agent-skill.zip
            dist/opentodo-mcp-skill.zip

  # The parts of `make check` the jobs above do not run, through the same make
  # targets (`make ci-checks`): gofmt, OpenSpec validation (pinned CLI), the
  # design-system lint, translation catalogs, every platform template and the site
  # bundle tests, and the repository checks. Further `make` gates (static analysis,
  # web lint) join `ci-checks`.
  checks:
    name: Checks (gofmt, OpenSpec, UI lint, translations, deploy templates, repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The translation checks parse the sources with web's TypeScript.
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: make ci-checks
      # Here rather than in the web job, so a docs-only pull request runs it too.
      - name: Docs check (front matter, links, images, spec coverage, generated files current)
        run: npm run docs:check
        working-directory: web

  # The image under test (OpenSpec ci-release-gates): built for linux/amd64 into the
  # runner's Docker, scanned (a critical vulnerability with a fixed version fails),
  # then started the way Coolify starts the template (health check, owner setup,
  # closed sign-up, https base URL, data surviving a recreate). Runs on pull requests
  # too; the docker job publishes only after this and every other gate passed.
  image:
    name: Docker image (build, scan, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, web-sign]
    # web-sign runs on release tags only; elsewhere it is skipped, not failed.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A release builds the image around the signed web app (signed-web-app D4).
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-signed
          path: web-dist-signed
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The runner's platform (linux/amd64). No `platforms:` key here: the site
          # bundle reads the published architectures from the first one in this file.
          context: .
          load: true
          push: false
          tags: opentodo:ci
          build-contexts: ${{ startsWith(github.ref, 'refs/tags/v') && 'web-dist=web-dist-signed' || '' }}
          # A release reports its tag; anything else (latest, pull requests) dev+<commit>, never the branch name (#160).
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64
      # The scanner and its database are downloaded from GitHub releases, which sometimes answer
      # 504. A failed first scan runs once more: a real finding fails both times, a download
      # hiccup only the first.
      - name: Vulnerability scan (fails on critical findings that have a fix)
        id: scan
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: opentodo:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: Vulnerability scan, second attempt
        if: steps.scan.outcome == 'failure'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: opentodo:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Smoke test the built image like Coolify starts it
        run: node scripts/coolify-template-check.mjs --smoke --image opentodo:ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The web app the image serves matches its file list, downloaded as a browser
      # does (signed-web-app D4). Once the official keys exist, a release must be signed
      # by one of them, or it does not publish.
      - name: The served web app matches its signed file list
        env:
          REF: ${{ github.ref }}
        run: |
          docker run -d --name websign-check -p 18095:8080 opentodo:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18095/healthz >/dev/null 2>&1 && break; sleep 1; done
          require=""
          case "$REF" in refs/tags/v*) grep -q '"spki"' internal/websign/release-keys.json && require=-require-signed ;; esac
          go run ./cmd/websign verify $require http://127.0.0.1:18095/
          docker rm -f websign-check

  # The one required check of the main branch ruleset and its merge queue: it fails when
  # any job of the tier failed or was cancelled; a job skipped by the path filter passes.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, web-build, web, web-scale, server, layout, a11y-screens, docs-site, site-bundle, ui-storybook, ui-a11y, ui-visual, cli, extension, obsidian, android, ios, skill, checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  # Publishes the multi-arch image (main and v* tags), only after every gate above
  # passed (OpenSpec ci-release-gates): `stable`, `latest` and the version tags never
  # move on a run whose layout, UI, docs, template or image checks failed. The image
  # carries an SBOM and maximal SLSA provenance, and its digest is signed keylessly
  # with cosign (Sigstore, GitHub OIDC). See docs/self-hosting/verify.md.
  docker:
    name: Docker image (publish, sign)
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, web-build, web-sign, web, web-scale, server, layout, a11y-screens, docs-site, site-bundle, ui-storybook, ui-a11y, ui-visual, cli, extension, obsidian, android, android-sign, ios, skill, checks, image, result]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A release publishes the image around the signed web app (signed-web-app D4).
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-signed
          path: web-dist-signed
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # The major line from 1.0 on (docs/stability.md): `1` follows every 1.x release.
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # The tag every platform template names (OpenSpec stable-image-tag): releases only, never release candidates.
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: ${{ startsWith(github.ref, 'refs/tags/v') && 'web-dist=web-dist-signed' || '' }}
          # A release reports its tag; anything else (latest, pull requests) dev+<commit>, never the branch name (#160).
          # `latest` is never signed and says so (signed-web-app D4).
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            OPENTODO_BUILD=${{ github.ref == 'refs/heads/main' && 'preview' || '' }}
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-release
          cache-to: type=gha,mode=max,scope=image-release
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${image}@${DIGEST}"

  # One job publishes the GitHub release for a v* tag, after everything it ships
  # has built and every gate passed: server and `ot` binaries for every platform,
  # the extension zips (Chrome and Firefox), the agent skill zip, the site bundle and SHA256SUMS, with a
  # build provenance attestation for each (`gh attestation verify`). Notes come from
  # the tag's section in CHANGELOG.md. A failed site bundle keeps the release unpublished.
  release:
    name: GitHub release
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, web-build, web-sign, web, web-scale, server, layout, a11y-screens, docs-site, site-bundle, ui-storybook, ui-a11y, ui-visual, cli, extension, obsidian, android, android-sign, ios, skill, checks, image, result, docker]
    permissions:
      contents: write
      id-token: write # build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The image can be pulled without signing in
        # Every install pulls the image anonymously; a package left private on ghcr.io
        # (the Home Assistant add-on's image after the move to OpenTodoApp) answers 401
        # to all of them. Fails the release before it is published, naming the setting.
        run: scripts/release/check-public-image.sh "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect assets and checksums
        # Only the files named in the script, never the rest of an artifact (the web
        # app's build chunks reached v0.20.0 through a catch-all name pattern).
        run: scripts/release/collect-assets.sh artifacts release
      - name: Build provenance for every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          # Only tags like v1.2.0-rc.1 are pre-releases; a plain vX.Y.Z is a normal release.
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # The release may already exist when it was created in the GitHub UI (which
          # also creates the tag): then title, notes and the pre-release flag are set
          # from CHANGELOG.md here, so nothing has to be typed there.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "OpenTodo $GITHUB_REF_NAME" --notes-file notes.md ${pre:---prerelease=false}
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "OpenTodo $GITHUB_REF_NAME" --notes-file notes.md $pre
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber

  # Google Play (OpenSpec change play-production D1, D2): after the release, the AAB of a
  # final tag is put on Play's internal testing track (scripts/release/play-upload.mjs),
  # re-signed with the upload key when one is set; a person promotes it to production in
  # the Play Console (RELEASING.md). The secrets live in the `release` environment. Release
  # candidates upload nothing; without the service account the job warns and succeeds, and
  # the release never depends on it.
  play:
    name: Google Play (internal track)
    # !cancelled() && !failure(): a skipped job upstream (the app builds skip on tags) must not
    # skip publishing; plain success() is false when any job in the needs chain was skipped (1.4.0).
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release]
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21.0.13+9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentodo-android
          path: dist
        continue-on-error: true
      - name: Upload the AAB (re-signed with the upload key when one is set)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          aab="dist/opentodo-android-${GITHUB_REF_NAME#v}.aab"
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set: no Google Play upload for this release"
            exit 0
          fi
          if [ ! -f "$aab" ]; then
            echo "::warning::No signed AAB for $GITHUB_REF_NAME: no Google Play upload for this release"
            exit 0
          fi
          upload="$aab"
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            # With an upload key, the release key's signature comes off and the upload key's
            # goes on (Play App Signing re-signs with the release key, so every source keeps
            # one certificate). Without one, the release-signed AAB goes up as it is, as Play
            # accepted for 1.6.0 and 1.7.0.
            upload="$RUNNER_TEMP/upload.aab"
            cp "$aab" "$upload"
            zip -q -d "$upload" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
            trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            # jarsigner's output names what is wrong (alias, password) and holds no secret.
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env UPLOAD_KEYSTORE_PASSWORD -keypass:env UPLOAD_KEY_PASSWORD "$upload" "$UPLOAD_KEY_ALIAS"
            rm -f "$RUNNER_TEMP/upload.jks"
          fi
          node scripts/release/play-upload.mjs "$GITHUB_REF_NAME" "$upload"

  # TestFlight (OpenSpec change ios-distribution D5, D9): after the release, the iPhone app of a
  # final tag is archived, signed through the App Store Connect API and uploaded to TestFlight by
  # .github/workflows/ios-testflight.yml, which the owner can also run by hand for any ref, then
  # submitted for App Store review (D10, released after approval). The secrets live in the
  # `release` environment; without them the job warns and succeeds, and the release never depends
  # on it.
  ios-testflight:
    name: iOS (TestFlight)
    # !cancelled() && !failure(): a skipped job upstream (the app builds skip on tags) must not
    # skip publishing; plain success() is false when any job in the needs chain was skipped (1.4.0).
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: [release]
    uses: ./.github/workflows/ios-testflight.yml
    # A called workflow sees no secrets unless they are passed on: without this the tag's
    # TestFlight job found none and only warned (1.3.0).
    secrets: inherit
    with:
      ref: ${{ github.ref_name }}

  # The Claude Code plugin marketplace (OpenSpec change claude-plugin): after the
  # release, deploy/claude-plugin/upstream/ of the tag becomes the content of
  # OpenTodoApp/opentodo-claude, committed and tagged with the version. The deploy key in
  # CLAUDE_PLUGIN_DEPLOY_KEY may write to that one repository only. Without it (a fork,
  # or before the owner adds it) the job prints the manual steps and succeeds: the
  # release never depends on it.
  claude-plugin:
    name: Claude Code plugin (publish)
    # Release candidates (v1.0.0-rc.1) are never published to the marketplace (release-candidates).
    # !cancelled() && !failure(): a skipped job upstream (the app builds skip on tags) must not
    # skip publishing; plain success() is false when any job in the needs chain was skipped (1.4.0).
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release]
    environment: signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish to OpenTodoApp/opentodo-claude
        env:
          DEPLOY_KEY: ${{ secrets.CLAUDE_PLUGIN_DEPLOY_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::CLAUDE_PLUGIN_DEPLOY_KEY is not set; publish the plugin by hand (deploy/claude-plugin/README.md):"
            echo "  git clone git@github.com:OpenTodoApp/opentodo-claude.git /tmp/opentodo-claude"
            echo "  rsync -a --delete --exclude .git deploy/claude-plugin/upstream/ /tmp/opentodo-claude/"
            echo "  cd /tmp/opentodo-claude && git add -A && git commit -m 'OpenTodo $version' && git tag v$version && git push origin HEAD --tags"
            exit 0
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:OpenTodoApp/opentodo-claude.git "$RUNNER_TEMP/plugin"
          rsync -a --delete --exclude .git deploy/claude-plugin/upstream/ "$RUNNER_TEMP/plugin/"
          cd "$RUNNER_TEMP/plugin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed since the last publish"
          else
            git commit -q -m "OpenTodo $version"
          fi
          git tag -f "v$version"
          git push origin HEAD
          git push -f origin "v$version"
          rm -f "$RUNNER_TEMP/deploy_key"

  # The Obsidian plugin's release repository (OpenSpec change obsidian-plugin D1):
  # Obsidian installs a plugin from the release of its own repository whose tag is
  # the manifest's version, so after the release this job builds the plugin of the
  # tag and pushes manifest.json (version = the release's), main.js, styles.css,
  # versions.json, the README and the licence to OpenTodoApp/obsidian-opentodo,
  # tagged with the bare version; that repository's own workflow
  # (obsidian/mirror/release.yml) attaches the three files to a release. The deploy
  # key in OBSIDIAN_DEPLOY_KEY may write to that one repository only. Without it
  # (a fork, or before the owner adds it) the job prints the manual steps and
  # succeeds: the release never depends on it.
  obsidian-plugin:
    name: Obsidian plugin (publish)
    # Release candidates are never pushed: Obsidian installs the repository's latest version (release-candidates).
    # !cancelled() && !failure(): a skipped job upstream (the app builds skip on tags) must not
    # skip publishing; plain success() is false when any job in the needs chain was skipped (1.4.0).
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release]
    environment: signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: make obsidian
      - name: Publish to OpenTodoApp/obsidian-opentodo
        env:
          DEPLOY_KEY: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::OBSIDIAN_DEPLOY_KEY is not set; publish the plugin by hand (obsidian/README.md, Releases):"
            echo "  node obsidian/scripts/mirror.mjs $version /tmp/obsidian-opentodo   # in a clone of OpenTodoApp/obsidian-opentodo"
            echo "  cd /tmp/obsidian-opentodo && git add -A && git commit -m 'OpenTodo $version' && git tag $version && git push origin HEAD --tags"
            exit 0
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:OpenTodoApp/obsidian-opentodo.git "$RUNNER_TEMP/mirror"
          node obsidian/scripts/mirror.mjs "$version" "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed since the last publish"
          else
            git commit -q -m "OpenTodo $version"
          fi
          git tag -f "$version"
          git push origin HEAD
          git push -f origin "$version"
          rm -f "$RUNNER_TEMP/deploy_key"
