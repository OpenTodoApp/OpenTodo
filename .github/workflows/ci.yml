name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One run per ref (OpenSpec ci-release-gates): a new push to a pull request cancels
# its running checks; main and release tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENSPEC_TELEMETRY: "0"

# Every action is pinned to a full commit SHA with its release in a comment, every
# job has a timeout, and container images are pinned by digest (OpenSpec
# ci-release-gates; scripts/repo-checks.test.mjs checks all three). Dependabot
# (.github/dependabot.yml) proposes the updates.
jobs:
  # Path filters (OpenSpec site-bundle D7): which inputs a pull request touches,
  # from a plain `git diff`, no third-party action. Pushes to main and tags run
  # everything. `code` gates the Go, cross-compile, layout, UI and image jobs;
  # docs-only changes still run the web job (docs check), the docs website check
  # and the site bundle preview.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The path filter's table of cases, the shared Go toolchain and the compose
      # defaults (OpenSpec release-hygiene).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test scripts/repo-checks.test.mjs
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE"...HEAD > changed.txt
          cat changed.txt
          ./scripts/ci-changes.sh < changed.txt >> "$GITHUB_OUTPUT"

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - name: React hooks lint (make web-lint)
        run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Docs check (front matter, links, images, spec coverage, generated files current)
        run: npm run docs:check
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/web/dist
          include-hidden-files: true

  server:
    name: Server (vet, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, web]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - name: Toolchain matches go.mod (patched release toolchain)
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          go version | grep -q " $want " || { go version; echo "expected the go.mod toolchain $want"; exit 1; }
      - run: go vet ./...
      - name: staticcheck (version pinned in the Makefile)
        run: make staticcheck
      # Fails on vulnerabilities the code can reach (OpenSpec release-hygiene).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      - name: Smoke test the binary
        run: |
          OPENTODO_DATA_DIR=/tmp/ot ./bin/opentodo &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 0.5; done
          ./bin/opentodo healthcheck
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          kill %1
      - name: Build the CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/ot ./cmd/ot
      - name: Smoke test the CLI against a local server
        run: ./scripts/cli-smoke.sh | tee /dev/stderr | grep -q '^CLI OK$'

  # Opens every screen and overlay at 360/390/768 px, light and dark, in Chromium
  # and WebKit (Safari's engine) and fails on sideways scrolling, overlays or
  # close buttons off screen, overlays that do not close, and touch targets
  # under 44 px (OpenSpec change mobile-layout). Every screen and overlay, in
  # light and dark, and the docs website are also checked with axe-core
  # (serious and critical issues fail). Screenshots of failures are uploaded as the
  # layout-report-<engine>-<n> artifact. Then, on the Chromium leg, the browser end-to-end
  # checks: two devices, an offline edit converging, the PWA, inbox triage and saved
  # views (`make e2e`). One job for Chromium and one per width for WebKit, side by
  # side; each builds its own server binary and only needs the web build.
  layout:
    name: Layout check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, web]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The script seeds its data through Chromium, so every leg installs it.
          # WebKit is about twice as slow on the runner, so it is split by width.
          - { engine: chromium, name: Chromium, browsers: chromium, widths: '360,390,768' }
          - { engine: webkit, name: WebKit 360 px, browsers: chromium webkit, widths: '360' }
          - { engine: webkit, name: WebKit 390 px, browsers: chromium webkit, widths: '390' }
          - { engine: webkit, name: WebKit 768 px, browsers: chromium webkit, widths: '768' }
          # The longest catalogs on the narrowest phone (OpenSpec change phone-v2, design D9).
          - { engine: chromium, name: Chromium 360 px German, browsers: chromium, widths: '360', lang: de }
          - { engine: chromium, name: Chromium 360 px French, browsers: chromium, widths: '360', lang: fr }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      # axe-core for the accessibility checks (web devDependency).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install Playwright with ${{ matrix.name }}
        run: |
          npm i -g playwright@1.56.1
          playwright install --with-deps ${{ matrix.browsers }}
      - name: Run the layout check against a fresh server
        env:
          ENGINES: ${{ matrix.engine }}
          WIDTHS: ${{ matrix.widths }}
          OPENTODO_LANG: ${{ matrix.lang }}
        run: |
          OPENTODO_DATA_DIR=$(mktemp -d) ./bin/opentodo &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 0.5; done
          node scripts/e2e-layout.mjs layout-report
      - name: End-to-end (two devices, offline sync, inbox triage, saved views)
        if: matrix.engine == 'chromium' && !matrix.lang
        run: make e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: layout-report-${{ matrix.engine }}-${{ strategy.job-index }}
          path: layout-report

  # The interface audit (OpenSpec change ux-audit-three-widths): every screen of the
  # inventory at 360/768/1280 px, light and dark, English and German, measured against
  # the interface budget and the audited rules; the report (index.html, report.json,
  # screenshots) is uploaded as ux-audit-report. Non-blocking: the tour only reports,
  # unless the repository variable UX_AUDIT_STRICT is 1; its measurement tests fail it.
  ux-audit:
    name: Interface audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, web]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      # axe-core for M1 (web devDependency).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install Playwright with Chromium
        run: |
          npm i -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Measurement tests (fixtures in Chromium)
        run: node --test scripts/ux-audit/measure.test.mjs
      # Reports only, unless the maintainer sets the repository variable UX_AUDIT_STRICT to 1.
      - name: Run the audit tour
        continue-on-error: ${{ vars.UX_AUDIT_STRICT != '1' }}
        # About 1,000 captures; a run that takes longer is stopped without failing the job.
        timeout-minutes: 45
        env:
          UX_AUDIT_STRICT: ${{ vars.UX_AUDIT_STRICT }}
          CONCURRENCY: 3
        run: node scripts/ux-audit/tour.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ux-audit-report
          path: ux-audit-report

  # The docs website (user-documentation): no sideways scrolling at 360/390/1280 px,
  # axe-core without serious or critical issues, search, and pages without JavaScript.
  # Its own job so docs-only changes run it without the server and layout jobs.
  docs-site:
    name: Docs website (browser check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # axe-core for the accessibility checks (web devDependency).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install Playwright with Chromium
        run: |
          npm i -g playwright@1.56.1
          playwright install --with-deps chromium
      - run: node scripts/e2e-docs.mjs docs-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-report
          path: docs-report

  # The site bundle (OpenSpec site-bundle): docs site, screenshots, tokens, icons,
  # changelog and manifest for the website repository. Every run uploads it as an
  # artefact (a preview of unreleased docs); a v* tag names it after the tag and the
  # release job attaches it. The manifest's import formats come from the linux/amd64
  # server binary when the binaries were built, otherwise from `go run`.
  site-bundle:
    name: Site bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, cli]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.cli.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.cli.result == 'success'
        with:
          name: bin-linux-amd64
          path: bin-linux
      - name: Build the bundle
        id: bundle
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="$GITHUB_REF_NAME" ;;
            *) version="main-$(git rev-parse --short HEAD)" ;;
          esac
          [ "$GITHUB_EVENT_NAME" = pull_request ] && version="pr${{ github.event.pull_request.number }}-$(git rev-parse --short ${{ github.event.pull_request.head.sha }})"
          bin=""
          if [ -f bin-linux/opentodo-linux-amd64 ]; then chmod +x bin-linux/opentodo-linux-amd64; bin="--bin bin-linux/opentodo-linux-amd64"; fi
          node scripts/site-bundle.mjs --version "$version" $bin
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-site-bundle-${{ steps.bundle.outputs.version }}
          path: dist/opentodo-site-bundle-${{ steps.bundle.outputs.version }}.tar.gz
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  # Design workbench gates (OpenSpec design-language): every Storybook story in light
  # and dark is checked with axe-core (WCAG 2.2 AA, serious and critical fail) and
  # compared with the committed baselines in web/src/ui/__screenshots__ (375 and
  # 1280 px). Baselines come from the pinned Playwright image: `make ui-baselines`
  # or the "UI baselines" workflow. The two gates run as separate jobs, and the
  # visual comparison is split into three shards (Playwright --shard) that run side
  # by side; every part must pass. Diffs are uploaded as ui-check-report-<shard>.
  ui-a11y:
    name: UI check (workbench a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build-storybook
        working-directory: web
      - name: Accessibility (axe-core on every story, light and dark)
        run: node scripts/ui-check/a11y.mjs
      - name: Motion (Foundations/Motion under reduced motion and no motion)
        run: node scripts/ui-check/motion.mjs

  ui-visual:
    name: UI check (visual regression ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The same image `make ui-baselines` uses, so screenshots match the baselines
    # pixel for pixel. A missing baseline is written and the job fails; the
    # ui-check-report-<shard> artifact then carries it (web/src/ui/__screenshots__) to commit.
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm i -g --no-audit --no-fund playwright@1.56.1 @playwright/test@1.56.1
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build-storybook
        working-directory: web
      - name: Visual regression
        working-directory: scripts/ui-check
        run: NODE_PATH=$(npm root -g) playwright test -c playwright.config.ts --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-check-report-${{ matrix.shard }}
          path: |
            web/test-results/ui-visual
            web/playwright-report/ui-visual
            web/src/ui/__screenshots__

  cli:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, server]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Toolchain matches go.mod (patched release toolchain)
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          go version | grep -q " $want " || { go version; echo "expected the go.mod toolchain $want"; exit 1; }
      - name: Cross-compile ot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/ot-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/ot
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - name: Cross-compile the server (web app embedded)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/opentodo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/opentodo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  extension:
    name: Browser extension (test, package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Runs the unit tests, refuses a manifest with host permissions or a version
      # missing from extension/CHANGELOG.md, builds the Chrome and Firefox packages
      # and lints both with the web-ext version pinned in the Makefile.
      - run: make extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-browser-extension
          path: |
            dist/opentodo-browser-extension-chrome.zip
            dist/opentodo-browser-extension-firefox.zip

  # The Android app (OpenSpec change native-shells D9): unit tests, lint, the
  # AndroidX-only dependency check, translations and store metadata, a debug APK.
  # On tags, a release APK and AAB signed with the keystore from secrets (skipped
  # with a warning while the secrets are not set); the release job attaches them.
  android:
    name: Android app (test, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: make android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # Instrumented tests (native-shells 4.2–4.7) on one emulator: API 34, Google APIs
      # image (a current WebView), the AVD snapshot cached between runs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Emulator snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Failed instrumented tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          found = False
          for f in glob.glob('mobile/android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      found = True
                      msg = bad.get('message') or ((bad.text or '').strip().splitlines() or [''])[0]
                      print(f"::error title=Instrumented test failed::{case.get('classname')}.{case.get('name')}: {msg[:300]}")
          if not found:
              print('No failing test case in the JUnit results (the failure is outside the tests).')
          EOF
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-android-test-report
          path: |
            mobile/android/app/build/reports/androidTests/connected/
            mobile/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - name: Signed release APK and AAB (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: no signed Android build for this release"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          cd mobile/android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          OPENTODO_VERSION="$version" ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/opentodo-android-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../dist/opentodo-android-$version.aab"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-android
          path: dist/opentodo-android-*
          if-no-files-found: warn

  # The agent skills (OpenSpec changes agent-ready-cli and claude-plugin): the CLI
  # skill that `ot skill` prints and the MCP skill, zipped as release assets.
  skill:
    name: Agent skill (package)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make skill
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentodo-agent-skill
          path: |
            dist/opentodo-agent-skill.zip
            dist/opentodo-mcp-skill.zip

  # The parts of `make check` the jobs above do not run, through the same make
  # targets (`make ci-checks`): gofmt, OpenSpec validation (pinned CLI), the
  # design-system lint, translation catalogs, every platform template and the site
  # bundle tests, and the repository checks. Further `make` gates (static analysis,
  # web lint) join `ci-checks`.
  checks:
    name: Checks (gofmt, OpenSpec, UI lint, translations, deploy templates, repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The translation checks parse the sources with web's TypeScript.
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: make ci-checks

  # The image under test (OpenSpec ci-release-gates): built for linux/amd64 into the
  # runner's Docker, scanned (a critical vulnerability with a fixed version fails),
  # then started the way Coolify starts the template (health check, owner setup,
  # closed sign-up, https base URL, data surviving a recreate). Runs on pull requests
  # too; the docker job publishes only after this and every other gate passed.
  image:
    name: Docker image (build, scan, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The runner's platform (linux/amd64). No `platforms:` key here: the site
          # bundle reads the published architectures from the first one in this file.
          context: .
          load: true
          push: false
          tags: opentodo:ci
          # A release reports its tag; anything else (latest, pull requests) dev+<commit>, never the branch name (#160).
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64
      - name: Vulnerability scan (fails on critical findings that have a fix)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: opentodo:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Smoke test the built image like Coolify starts it
        run: node scripts/coolify-template-check.mjs --smoke --image opentodo:ci

  # Publishes the multi-arch image (main and v* tags), only after every gate above
  # passed (OpenSpec ci-release-gates): `stable`, `latest` and the version tags never
  # move on a run whose layout, UI, docs, template or image checks failed. The image
  # carries an SBOM and maximal SLSA provenance, and its digest is signed keylessly
  # with cosign (Sigstore, GitHub OIDC). See docs/self-hosting/verify.md.
  docker:
    name: Docker image (publish, sign)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, web, server, layout, ux-audit, docs-site, site-bundle, ui-a11y, ui-visual, cli, extension, android, skill, checks, image]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # The tag every platform template names (OpenSpec stable-image-tag): releases only, never release candidates.
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A release reports its tag; anything else (latest, pull requests) dev+<commit>, never the branch name (#160).
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-release
          cache-to: type=gha,mode=max,scope=image-release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${image}@${DIGEST}"

  # One job publishes the GitHub release for a v* tag, after everything it ships
  # has built and every gate passed: server and `ot` binaries for every platform,
  # the extension zips (Chrome and Firefox), the agent skill zip, the site bundle and SHA256SUMS, with a
  # build provenance attestation for each (`gh attestation verify`). Notes come from
  # the tag's section in CHANGELOG.md. A failed site bundle keeps the release unpublished.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, web, server, layout, ux-audit, docs-site, site-bundle, ui-a11y, ui-visual, cli, extension, android, skill, checks, image, docker]
    permissions:
      contents: write
      id-token: write # build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'opentodo-*' -o -name 'ot-*' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance for every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          # Only tags like v1.2.0-rc.1 are pre-releases; a plain vX.Y.Z is a normal release.
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # The release may already exist when it was created in the GitHub UI (which
          # also creates the tag): then title, notes and the pre-release flag are set
          # from CHANGELOG.md here, so nothing has to be typed there.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "OpenTodo $GITHUB_REF_NAME" --notes-file notes.md ${pre:---prerelease=false}
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "OpenTodo $GITHUB_REF_NAME" --notes-file notes.md $pre
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber

  # The Claude Code plugin marketplace (OpenSpec change claude-plugin): after the
  # release, deploy/claude-plugin/upstream/ of the tag becomes the content of
  # pixari/opentodo-claude, committed and tagged with the version. The deploy key in
  # CLAUDE_PLUGIN_DEPLOY_KEY may write to that one repository only. Without it (a fork,
  # or before the owner adds it) the job prints the manual steps and succeeds: the
  # release never depends on it.
  claude-plugin:
    name: Claude Code plugin (publish)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish to pixari/opentodo-claude
        env:
          DEPLOY_KEY: ${{ secrets.CLAUDE_PLUGIN_DEPLOY_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::CLAUDE_PLUGIN_DEPLOY_KEY is not set; publish the plugin by hand (deploy/claude-plugin/README.md):"
            echo "  git clone git@github.com:pixari/opentodo-claude.git /tmp/opentodo-claude"
            echo "  rsync -a --delete --exclude .git deploy/claude-plugin/upstream/ /tmp/opentodo-claude/"
            echo "  cd /tmp/opentodo-claude && git add -A && git commit -m 'OpenTodo $version' && git tag v$version && git push origin HEAD --tags"
            exit 0
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:pixari/opentodo-claude.git "$RUNNER_TEMP/plugin"
          rsync -a --delete --exclude .git deploy/claude-plugin/upstream/ "$RUNNER_TEMP/plugin/"
          cd "$RUNNER_TEMP/plugin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed since the last publish"
          else
            git commit -q -m "OpenTodo $version"
          fi
          git tag -f "v$version"
          git push origin HEAD
          git push -f origin "v$version"
          rm -f "$RUNNER_TEMP/deploy_key"
