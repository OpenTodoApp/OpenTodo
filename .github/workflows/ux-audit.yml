name: Interface audit

# The interface audit (OpenSpec web-app "Interface audit tour", change
# ux-audit-three-widths): every screen of the inventory at 360/768/1280 px, light
# and dark, English and German, measured against the interface budget and the
# audited rules; the report (index.html, report.json, screenshots) is uploaded as
# ux-audit-report. Non-blocking: the tour only reports, unless the repository
# variable UX_AUDIT_STRICT is 1; its measurement tests fail it.
#
# Its own workflow, off every critical path (tiered CI, ci-speed): nightly on main
# and on demand (Actions → Interface audit → Run workflow, on any branch); neither a
# pull request nor publishing waits for it.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ux-audit:
    name: Interface audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # axe-core for M1 (web devDependency) and the web app the server embeds.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      - name: Install Playwright with Chromium
        run: scripts/ci-playwright-install.sh 1.56.1 chromium
      - name: Measurement tests (fixtures in Chromium)
        run: node --test scripts/ux-audit/measure.test.mjs
      # Reports only, unless the maintainer sets the repository variable UX_AUDIT_STRICT to 1.
      - name: Run the audit tour
        continue-on-error: ${{ vars.UX_AUDIT_STRICT != '1' }}
        # About 1,000 captures; a run that takes longer is stopped without failing the job.
        timeout-minutes: 45
        env:
          UX_AUDIT_STRICT: ${{ vars.UX_AUDIT_STRICT }}
          CONCURRENCY: 3
        run: node scripts/ux-audit/tour.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ux-audit-report
          path: ux-audit-report
