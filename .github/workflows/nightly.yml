name: Nightly

# Checks too slow for every pull request (OpenSpec ci-release-gates): the Go tests
# under the race detector, which watches the background schedulers (backups,
# reminders, digests, email polling, webhooks) and the sync hub. Also runs on demand.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  race:
    name: Go tests with the race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The server tests serve the embedded web app.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: go test -race -timeout 45m ./...
