name: Nightly

# Checks too slow for every pull request (OpenSpec ci-release-gates): the Go tests
# under the race detector, which watches the background schedulers (backups,
# reminders, digests, email polling, webhooks) and the sync hub. Also runs on demand.
# Also the upgrade check: data written by released versions, read by this build.
# It runs on pull requests that touch the schema, the op log or accounts too.
# A failed night opens (or comments on) one issue labelled ci-nightly; the next
# green night closes it, so a red nightly never goes unnoticed.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - internal/store/**
      - internal/sync/**
      - internal/auth/**
      - internal/httpapi/export.go
      - scripts/upgrade-check.mjs
      - .github/workflows/nightly.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  race:
    name: Go tests with the race detector
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The server tests serve the embedded web app.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: go test -race -timeout 45m ./...

  # Each of the three newest releases and the oldest with a server binary writes an
  # account's data through its own API; this build then starts on that data
  # directory and must migrate it and read everything back (OpenSpec
  # self-hosting "Upgrades from released versions keep the data").
  upgrade:
    name: Upgrade from released versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The API is what is checked: the server builds without the web app (dist/.gitkeep).
      - run: CGO_ENABLED=0 go build -trimpath -o bin/opentodo ./cmd/opentodo
      - name: Upgrade check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upgrade-check.mjs

  # Opens or updates the ci-nightly issue when a nightly job fails, and closes it
  # when every job passes again. Only GITHUB_TOKEN, only on the default branch.
  alert:
    name: Report the nightly result
    needs: [race, upgrade]
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the ci-nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/nightly-alert.sh
