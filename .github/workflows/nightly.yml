name: Nightly

# Checks too slow for every pull request (OpenSpec ci-release-gates): the Go tests
# under the race detector, which watches the background schedulers (backups,
# reminders, digests, email polling, webhooks) and the sync hub, the fuzz
# targets (scripts/fuzz.sh), the performance budgets (perf.yml), the
# accessibility gate's full matrix (accessibility-aa) and the native app's iOS and
# Android builds (app-native.yml, native-app-foundation D9). Also runs on demand.
# A failed night opens (or comments on) one issue labelled ci-nightly; the next
# green night closes it, so a red nightly never goes unnoticed.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  race:
    name: Go tests with the race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The server tests serve the embedded web app.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: go test -race -timeout 45m ./...

  # Fuzz targets of the parsers of untrusted input (2026-10 audit, wave 2):
  # every func FuzzXxx runs for a minute. Their seed corpora and any committed
  # crashers (testdata/fuzz) already run as plain tests in every CI run; this
  # explores beyond them. A failing input is uploaded so it can be committed
  # with its fix.
  fuzz:
    name: Go fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: scripts/fuzz.sh 60s
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failing-inputs
          path: internal/**/testdata/fuzz/
          retention-days: 30

  # The performance budgets at 10,000 tasks (OpenSpec performance-10k): five timed
  # runs of every server, desktop and phone-profile metric (perf.yml). Its
  # failures, one metric per line, travel to the alert.
  perf:
    uses: ./.github/workflows/perf.yml

  # The accessibility gate's full matrix (OpenSpec accessibility "Accessibility gate on
  # real screens", change accessibility-aa D1): every screen of the inventory at 360, 768
  # and 1280 px, light and dark, English and German, with the browser's text size at 20
  # px; the same rules as the pull request job (serious and critical axe findings, focus,
  # target size, reflow, text spacing, credential fields). Four shards of the inventory.
  a11y:
    name: Accessibility gate (full matrix ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/opentodo ./cmd/opentodo
      - run: npm i -g --no-audit --no-fund playwright@1.56.1
      - name: Accessibility gate (360, 768 and 1280 px, English and German, text size 20)
        env:
          A11Y_ONLY: "1"
          WIDTHS: 360,768,1280
          LANGS: en,de
          TEXT_SIZE: "20"
          SHARD: ${{ matrix.shard }}/4
          CONCURRENCY: 3
          OUT_DIR: a11y-report
        run: node scripts/ux-audit/tour.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: a11y-report-${{ matrix.shard }}
          path: a11y-report

  # The native app's iOS and Android builds on main (native-app-foundation D9): pull
  # requests build them only when mobile/app/ changes, so a shared-module change that
  # breaks a native build shows up here.
  app-native:
    uses: ./.github/workflows/app-native.yml

  # Opens or updates the ci-nightly issue when a nightly job fails, and closes it
  # when every job passes again. Only GITHUB_TOKEN, only on the default branch.
  alert:
    name: Report the nightly result
    needs: [race, fuzz, perf, a11y, app-native]
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the ci-nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/nightly-alert.sh
