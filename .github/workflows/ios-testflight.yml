name: iOS TestFlight

# The iPhone app to TestFlight (OpenSpec change ios-distribution D5, D9). ci.yml calls this after
# the GitHub release of every final tag (v1.2.0, never v1.2.0-rc.1); Actions → iOS TestFlight →
# Run workflow uploads a release tag by hand. Only a tag is ever checked out: the job holds the
# App Store Connect key, so it never runs a branch's or a commit's code.
#
# A final tag's build then goes to App Store review (D10): once Apple has processed it,
# scripts/release/appstore.mjs submit makes the App Store version, sets What's New from
# CHANGELOG.md in every localization, attaches the build and submits it, released after approval.
# A release candidate is never submitted. A run again changes nothing that is already submitted,
# in review or approved. `app_store` is `submit` after a release, and `dry-run` by default for a
# run by hand (it logs what it would write); `skip` uploads only; `submit-only` uploads nothing and
# submits the build named by `build_number`, already in App Store Connect.
#
# Signing needs no Mac and nothing stored: the archive is built unsigned and signed ad hoc, then
# scripts/release/appstore.mjs makes an Apple Distribution certificate from a key generated on the
# runner and one App Store profile per bundle ID through the App Store Connect API, the export
# signs with them (checked before the upload), altool uploads, and the job waits until Apple has
# processed the build. The certificate of an uploaded build stays valid: Apple checks the signature
# again when the build is submitted for review, and a revoked one makes it ITMS-90035 "Invalid
# Signature". Its private key never leaves the runner, so nobody can sign with it. At Apple's
# limit of certificates the next run retires the oldest one this workflow made. The last step
# deletes the keychain and the key whatever happened, and revokes the certificate and deletes the
# profiles only when nothing was uploaded. The secrets are in the `release`
# environment: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8. Without them the job warns
# and succeeds, so a fork or a release before the owner set this up stays green.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      build_number:
        type: string
        required: false
        default: ""
      app_store:
        type: string
        required: false
        default: submit
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to upload, such as v1.2.0
        required: true
      build_number:
        description: Build number to use instead of the next free one (10200 or 10200.N for 1.2.0); usually empty
        required: false
        default: ""
      app_store:
        description: "App Store review for a final tag: submit, dry-run (log what it would do), skip, or submit-only (no upload: submit build_number)"
        type: choice
        options: [dry-run, submit, skip, submit-only]
        default: dry-run

permissions:
  contents: read

# One signing run at a time: Apple allows only a few distribution certificates per team.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios-testflight:
    name: iOS (TestFlight upload)
    runs-on: macos-15
    timeout-minutes: 100
    environment: release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      # Before anything else: the ref must be a release tag (vMAJOR.MINOR.PATCH, a release
      # candidate allowed for a hand run), checked out below as refs/tags/<tag>, so a branch or a
      # pull request's head named like a tag cannot be uploaded with the release key.
      - name: Release tag only
        env:
          REF: ${{ inputs.ref }}
          MODE: ${{ inputs.app_store }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::ref must be a release tag such as v1.2.0, got: $REF"
            exit 1
          fi
          if [ "$MODE" = "submit-only" ] && { [ -z "$BUILD_NUMBER" ] || printf '%s' "$REF" | grep -q -- '-rc\.'; }; then
            echo "::error::submit-only needs a final tag and the build_number of a build already in App Store Connect"
            exit 1
          fi
      - name: Secrets
        id: secrets
        run: |
          { echo "SIGNING=$RUNNER_TEMP/signing"; echo "ARCHIVE=$RUNNER_TEMP/OpenTodo.xcarchive"; } >> "$GITHUB_ENV"
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 is not set in the release environment: no TestFlight upload"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: refs/tags/${{ inputs.ref }}
          # The version comes from the last tag (git describe), so the history and tags are needed.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
      - name: Bundle IDs and App Groups (registered when missing)
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/release/appstore.mjs register
      - name: Version and build number
        id: version
        if: steps.secrets.outputs.ready == 'true'
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          REF: ${{ inputs.ref }}
        run: |
          described=$(git describe --tags --abbrev=0)
          v=$(node scripts/release/appstore.mjs version "$described")
          read -r version code <<< "$v"
          # A commit with two tags (v1.2.0 and v1.3.0-rc.1) must not build or submit the other one's version.
          read -r asked _ <<< "$(node scripts/release/appstore.mjs version "$REF")"
          if [ "$asked" != "$version" ]; then
            echo "::error::$REF is version $asked, but git describe found $described ($version): run it for $described, or remove the extra tag"
            exit 1
          fi
          build=$(node scripts/release/appstore.mjs build-number "$version" "$BUILD_NUMBER")
          app_id=$(node scripts/release/appstore.mjs app-id)
          echo "version $version, build $build (version code $code), app $app_id"
          { echo "version=$version"; echo "build=$build"; echo "app_id=$app_id"; } >> "$GITHUB_OUTPUT"
      - name: Newest Xcode
        if: steps.secrets.outputs.ready == 'true' && inputs.app_store != 'submit-only'
        run: scripts/release/ios-testflight.sh xcode
      - name: Archive, unsigned, then signed ad hoc with the entitlements
        if: steps.secrets.outputs.ready == 'true' && inputs.app_store != 'submit-only'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: scripts/release/ios-testflight.sh archive "$ARCHIVE" "$VERSION" "$BUILD" "$APPLE_TEAM_ID"
      - name: This run's distribution certificate and App Store profiles
        if: steps.secrets.outputs.ready == 'true' && inputs.app_store != 'submit-only'
        run: |
          scripts/release/ios-testflight.sh csr "$SIGNING"
          node scripts/release/appstore.mjs sign "$SIGNING"
          scripts/release/ios-testflight.sh keychain "$SIGNING"
      - name: Export for the App Store, then check its signature
        if: steps.secrets.outputs.ready == 'true' && inputs.app_store != 'submit-only'
        run: scripts/release/ios-testflight.sh export "$ARCHIVE" "$SIGNING" "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        id: upload
        if: steps.secrets.outputs.ready == 'true' && inputs.app_store != 'submit-only'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          APP_ID: ${{ steps.version.outputs.app_id }}
        run: |
          export ASC_KEY_FILE="$RUNNER_TEMP/asc-keys/AuthKey_$ASC_KEY_ID.p8"
          node scripts/release/appstore.mjs key-file "$ASC_KEY_FILE"
          scripts/release/ios-testflight.sh upload "$RUNNER_TEMP"/export/*.ipa "$APP_ID" "$VERSION" "$BUILD"
      - name: What to test
        if: steps.secrets.outputs.ready == 'true' && inputs.app_store != 'submit-only'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: node scripts/release/appstore.mjs notes "$VERSION" "$BUILD"
      - name: Wait for Apple to process the build (the certificate must stay valid until then)
        if: steps.secrets.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: node scripts/release/appstore.mjs processed "$VERSION" "$BUILD"
      # A final tag only (vX.Y.Z, checked above); a build still processing is left for a run again.
      - name: Submit for App Store review (a final tag)
        id: submit
        if: steps.secrets.outputs.ready == 'true' && !contains(inputs.ref, '-rc.') && (inputs.app_store == 'submit' || inputs.app_store == 'dry-run' || inputs.app_store == 'submit-only')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          MODE: ${{ inputs.app_store }}
        run: |
          if [ "$MODE" = "dry-run" ]; then node scripts/release/appstore.mjs submit "$VERSION" "$BUILD" --dry-run
          else node scripts/release/appstore.mjs submit "$VERSION" "$BUILD"; fi
      - name: Delete the keychain and the key; revoke the certificate only if nothing was uploaded
        if: always() && steps.secrets.outputs.ready == 'true'
        env:
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
        run: |
          status=0
          if [ "$UPLOADED" != "true" ] && [ -f "$SIGNING/state.json" ]; then node scripts/release/appstore.mjs cleanup "$SIGNING" || status=$?; fi
          scripts/release/ios-testflight.sh cleanup "$SIGNING" || status=$?
          rm -rf "$RUNNER_TEMP/asc-keys"
          exit $status
      - name: Summary
        if: success() && steps.secrets.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          STATE: ${{ steps.submit.outputs.state }}
        run: |
          case "$STATE" in
            submitted) review="it is submitted for App Store review and is released after approval" ;;
            already-submitted) review="its App Store version was already submitted, in review or approved: nothing changed" ;;
            build-not-ready) review="Apple had not processed it yet, so nothing was submitted: run the workflow again with app_store submit" ;;
            dry-run) review="a dry run: the submit step's notices list what it would have written" ;;
            *) review="it was not submitted for review" ;;
          esac
          echo "OpenTodo $VERSION ($BUILD) is uploaded to TestFlight; $review." >> "$GITHUB_STEP_SUMMARY"
