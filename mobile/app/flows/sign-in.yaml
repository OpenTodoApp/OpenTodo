# Sign-in through the system's authentication sheet (native-app-foundation 4.4): the
# app holds the account across a restart, and signing out returns to the server screen.
# flows/run.sh passes APP_ID, SERVER and the account.
appId: ${APP_ID}
---
- runFlow: steps/sign-in.yaml
- takeScreenshot: today-empty
# The account is kept: a restart opens it without the server screen.
- stopApp
- launchApp
- assertVisible:
    id: today-list
# Just after a start the tab bar may not take its first tap yet.
- tapOn:
    id: tab-browse
    retryTapIfNoChange: true
- assertVisible: ${ACCOUNT_NAME}
- tapOn:
    id: sign-out
- assertVisible:
    id: server-address
- takeScreenshot: server
