# From a fresh install to Today: the server's address, the server's own sign-in page in
# the system's sheet, the confirmation. Used by the flows; not a flow of its own.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: server-address
- inputText: ${SERVER}
- tapOn:
    id: server-continue
# iOS asks before an app opens a sign-in sheet.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Continue
# The sheet shows the server's sign-in page, or the confirmation at once when this
# browser is signed in already; both have a "Sign in" button.
- extendedWaitUntil:
    visible: Sign in
    timeout: 30000
- runFlow:
    when:
      visible: Password
    commands:
      - tapOn: Email
      - inputText: ${ACCOUNT_EMAIL}
      - tapOn: Password
      - inputText: ${ACCOUNT_PASSWORD}
      - tapOn: Sign in
      # iOS offers to keep the password.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: Not Now
                optional: true
- extendedWaitUntil:
    visible: Only confirm if you started signing in from the app just now.
    timeout: 30000
- tapOn: Sign in
- extendedWaitUntil:
    visible:
      id: today-list
    timeout: 30000
