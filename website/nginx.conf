map $uri $cache_control {
    ~^/assets/      "public, max-age=604800";
    ~^/docs/images/ "public, max-age=86400";
    ~\.(css|js)$    "public, max-age=3600";
    default         "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docs pages are /docs/<slug>/index.html; an unknown docs path is a real 404.
    location /docs/ { try_files $uri $uri/index.html $uri/ =404; }
    location / { try_files $uri $uri/ /index.html; }
}
