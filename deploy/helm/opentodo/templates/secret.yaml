{{- if and .Values.setupToken.generate (not .Values.setupToken.existingSecret) }}
{{- $name := printf "%s-setup-token" (include "opentodo.fullname" .) }}
{{- $key := .Values.setupToken.secretKey }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opentodo.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated once and kept across upgrades (helm template and GitOps tools without lookup make a new one each time).
  {{- if and $old (hasKey $old.data $key) }}
  {{ $key }}: {{ index $old.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
