apiVersion: v2
name: opentodo
description: Open-source, local-first task manager. Works offline and syncs every device from one small container.
type: application
# Both follow the OpenTodo release (the chart is published from its v* tag): check with node scripts/deploy-check.mjs.
version: 0.9.0
appVersion: "0.9.0"
kubeVersion: ">=1.23.0-0"
home: https://open-todo.app
icon: https://raw.githubusercontent.com/pixari/opentodo/main/web/public/pwa-512.png
sources:
  - https://github.com/pixari/opentodo
keywords:
  - todo
  - tasks
  - productivity
  - self-hosted
  - local-first
maintainers:
  - name: pixari
    url: https://github.com/pixari
annotations:
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Documentation
      url: https://open-todo.app/docs/self-hosting/kubernetes/
    - name: support
      url: https://github.com/pixari/opentodo/issues
  artifacthub.io/images: |
    - name: opentodo
      image: ghcr.io/pixari/opentodo:0.9.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/prerelease: "false"
