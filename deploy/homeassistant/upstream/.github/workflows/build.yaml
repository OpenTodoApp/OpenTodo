# Builds the add-on image for amd64 and aarch64 with Home Assistant's builder actions and
# publishes ghcr.io/opentodoapp/opentodo-homeassistant:<version> (per-architecture images plus one
# multi-arch image). A version is published once: skip-existing leaves an existing tag alone,
# so a change to main without a new version only checks that the image still builds.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  APP: opentodo

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.info.outputs.image_name }}
      registry_prefix: ${{ steps.info.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      url: ${{ steps.info.outputs.url }}
      publish: ${{ steps.info.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Read config.yaml
        id: info
        env:
          EVENT: ${{ github.event_name }}
        run: |
          read_key() { yq -r ".$1" "${APP}/config.yaml"; }
          image="$(read_key image)"
          {
            echo "architectures=$(yq -o=json -I=0 '.arch' "${APP}/config.yaml")"
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=$(read_key version)"
            echo "name=$(read_key name)"
            echo "description=$(read_key description)"
            echo "url=$(read_key url)"
            if [ "${EVENT}" = pull_request ]; then echo "publish=false"; else echo "publish=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare the build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Build the image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./opentodo
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish the multi-arch image
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish the multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}
