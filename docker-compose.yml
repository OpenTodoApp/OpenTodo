# OpenTodo — one container, one volume.
#
# Plain Docker:   cp .env.example .env && docker compose up -d   → http://localhost:8080
# Coolify:        New resource → Docker Compose → point at this repository.
#                 Coolify reads SERVICE_URL_OPENTODO / SERVICE_FQDN_OPENTODO below,
#                 assigns the domain and provisions HTTPS. No variables are required.
#
# Every OPENTODO_* variable below is optional and passed through from .env (or
# Coolify's environment tab); empty means "use the default". The full table is
# in README.md#configuration.
#
# To build from source instead of pulling the published image, replace the
# `image:` line with `build: .`.

services:
  opentodo:
    image: ghcr.io/pixari/opentodo:latest
    restart: unless-stopped
    environment:
      # Coolify magic variables (ignored by plain docker compose). An OPENTODO_BASE_URL
      # you set yourself wins over the URL Coolify generates; it must be the exact
      # address users open (passkeys and cookies are bound to its host).
      - SERVICE_FQDN_OPENTODO_8080
      - OPENTODO_BASE_URL=${OPENTODO_BASE_URL:-${SERVICE_URL_OPENTODO:-}}
      - OPENTODO_ALLOW_SIGNUP=${OPENTODO_ALLOW_SIGNUP:-false}
      # Optional: when set (16+ characters), creating the first account requires it.
      - OPENTODO_SETUP_TOKEN=${OPENTODO_SETUP_TOKEN:-}
      - OPENTODO_SESSION_DAYS=${OPENTODO_SESSION_DAYS:-90}
      - OPENTODO_LOG_LEVEL=${OPENTODO_LOG_LEVEL:-info}
      - OPENTODO_IMPORT_MAX_MB=${OPENTODO_IMPORT_MAX_MB:-20}
      - OPENTODO_TRASH_RETENTION_DAYS=${OPENTODO_TRASH_RETENTION_DAYS:-}
      - OPENTODO_PUSH=${OPENTODO_PUSH:-}
      # Public demo instance (docs/self-hosting/demo.md); leave empty on a real server.
      - OPENTODO_DEMO=${OPENTODO_DEMO:-}
      - OPENTODO_DEMO_MAX_SANDBOXES=${OPENTODO_DEMO_MAX_SANDBOXES:-}
      - OPENTODO_DEMO_MAX_DB_MB=${OPENTODO_DEMO_MAX_DB_MB:-}
      # Behind Cloudflare or another CDN in front of your proxy: cloudflare, or IPs/CIDRs.
      - OPENTODO_TRUSTED_PROXIES=${OPENTODO_TRUSTED_PROXIES:-}
      # First-start presets; the owner's Settings win afterwards.
      - OPENTODO_WEBHOOKS_ALLOW_PRIVATE=${OPENTODO_WEBHOOKS_ALLOW_PRIVATE:-}
      - OPENTODO_MCP=${OPENTODO_MCP:-}
      - OPENTODO_CALDAV=${OPENTODO_CALDAV:-}
      # Optional single sign-on overrides (docs/self-hosting/sso.md); each one set locks that field in Settings.
      - OPENTODO_OIDC_ISSUER=${OPENTODO_OIDC_ISSUER:-}
      - OPENTODO_OIDC_CLIENT_ID=${OPENTODO_OIDC_CLIENT_ID:-}
      - OPENTODO_OIDC_CLIENT_SECRET=${OPENTODO_OIDC_CLIENT_SECRET:-}
      - OPENTODO_OIDC_DISPLAY_NAME=${OPENTODO_OIDC_DISPLAY_NAME:-}
      - OPENTODO_OIDC_SSO_ONLY=${OPENTODO_OIDC_SSO_ONLY:-}
      # Optional backup presets, applied once; Settings → Backups wins afterwards (docs/backups.md).
      - OPENTODO_BACKUP_DESTINATION=${OPENTODO_BACKUP_DESTINATION:-}
      - OPENTODO_BACKUP_LOCAL_DIR=${OPENTODO_BACKUP_LOCAL_DIR:-}
      - OPENTODO_BACKUP_SCHEDULE=${OPENTODO_BACKUP_SCHEDULE:-}
      - OPENTODO_BACKUP_TIME=${OPENTODO_BACKUP_TIME:-}
      - OPENTODO_BACKUP_WEEKDAY=${OPENTODO_BACKUP_WEEKDAY:-}
      - OPENTODO_BACKUP_KEEP=${OPENTODO_BACKUP_KEEP:-}
      - OPENTODO_BACKUP_MAX_AGE_DAYS=${OPENTODO_BACKUP_MAX_AGE_DAYS:-}
      - OPENTODO_BACKUP_COMPRESS=${OPENTODO_BACKUP_COMPRESS:-}
      - OPENTODO_BACKUP_S3_ENDPOINT=${OPENTODO_BACKUP_S3_ENDPOINT:-}
      - OPENTODO_BACKUP_S3_REGION=${OPENTODO_BACKUP_S3_REGION:-}
      - OPENTODO_BACKUP_S3_BUCKET=${OPENTODO_BACKUP_S3_BUCKET:-}
      - OPENTODO_BACKUP_S3_PREFIX=${OPENTODO_BACKUP_S3_PREFIX:-}
      - OPENTODO_BACKUP_S3_ACCESS_KEY=${OPENTODO_BACKUP_S3_ACCESS_KEY:-}
      - OPENTODO_BACKUP_S3_SECRET_KEY=${OPENTODO_BACKUP_S3_SECRET_KEY:-}
      - OPENTODO_BACKUP_S3_PATH_STYLE=${OPENTODO_BACKUP_S3_PATH_STYLE:-}
      - OPENTODO_BACKUP_WEBDAV_URL=${OPENTODO_BACKUP_WEBDAV_URL:-}
      - OPENTODO_BACKUP_WEBDAV_USERNAME=${OPENTODO_BACKUP_WEBDAV_USERNAME:-}
      - OPENTODO_BACKUP_WEBDAV_PASSWORD=${OPENTODO_BACKUP_WEBDAV_PASSWORD:-}
      - OPENTODO_BACKUP_WEBDAV_ALLOW_HTTP=${OPENTODO_BACKUP_WEBDAV_ALLOW_HTTP:-}
      - OPENTODO_BACKUP_PASSPHRASE=${OPENTODO_BACKUP_PASSPHRASE:-}
      - OPENTODO_BACKUP_PASSPHRASE_FILE=${OPENTODO_BACKUP_PASSPHRASE_FILE:-}
      # Optional email to task (docs/email.md): set the first four together, or none.
      - OPENTODO_EMAIL_ADDRESS=${OPENTODO_EMAIL_ADDRESS:-}
      - OPENTODO_EMAIL_IMAP_HOST=${OPENTODO_EMAIL_IMAP_HOST:-}
      - OPENTODO_EMAIL_IMAP_USER=${OPENTODO_EMAIL_IMAP_USER:-}
      - OPENTODO_EMAIL_IMAP_PASSWORD=${OPENTODO_EMAIL_IMAP_PASSWORD:-}
      - OPENTODO_EMAIL_IMAP_PASSWORD_FILE=${OPENTODO_EMAIL_IMAP_PASSWORD_FILE:-}
      - OPENTODO_EMAIL_IMAP_MAILBOX=${OPENTODO_EMAIL_IMAP_MAILBOX:-}
      - OPENTODO_EMAIL_POLL_SECONDS=${OPENTODO_EMAIL_POLL_SECONDS:-}
      - OPENTODO_EMAIL_PROCESSED=${OPENTODO_EMAIL_PROCESSED:-}
    volumes:
      - opentodo-data:/data
    ports:
      # Only used outside Coolify; Coolify routes through its proxy to port 8080.
      - "${OPENTODO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/opentodo", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  opentodo-data:
