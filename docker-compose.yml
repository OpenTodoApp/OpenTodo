# OpenTodo — one container, one volume.
#
# Plain Docker:   cp .env.example .env && docker compose up -d   → http://localhost:8080
# Coolify:        New resource → Docker Compose → point at this repository.
#                 Coolify reads SERVICE_URL_OPENTODO / SERVICE_FQDN_OPENTODO below,
#                 assigns the domain and provisions HTTPS. No variables are required.
#
# To build from source instead of pulling the published image, replace the
# `image:` line with `build: .`.

services:
  opentodo:
    image: ghcr.io/pixari/opentodo:latest
    restart: unless-stopped
    environment:
      # Coolify magic variables (ignored by plain docker compose).
      - SERVICE_FQDN_OPENTODO_8080
      - OPENTODO_BASE_URL=${SERVICE_URL_OPENTODO:-${OPENTODO_BASE_URL:-}}
      - OPENTODO_ALLOW_SIGNUP=${OPENTODO_ALLOW_SIGNUP:-false}
      - OPENTODO_SESSION_DAYS=${OPENTODO_SESSION_DAYS:-90}
      - OPENTODO_LOG_LEVEL=${OPENTODO_LOG_LEVEL:-info}
      - OPENTODO_IMPORT_MAX_MB=${OPENTODO_IMPORT_MAX_MB:-20}
      - OPENTODO_WEBHOOKS_ALLOW_PRIVATE=${OPENTODO_WEBHOOKS_ALLOW_PRIVATE:-}
      # Optional backup presets, applied once; Settings → Backups wins afterwards (docs/backups.md).
      - OPENTODO_BACKUP_DESTINATION=${OPENTODO_BACKUP_DESTINATION:-}
      - OPENTODO_BACKUP_LOCAL_DIR=${OPENTODO_BACKUP_LOCAL_DIR:-}
      - OPENTODO_BACKUP_SCHEDULE=${OPENTODO_BACKUP_SCHEDULE:-}
      - OPENTODO_BACKUP_TIME=${OPENTODO_BACKUP_TIME:-}
      - OPENTODO_BACKUP_WEEKDAY=${OPENTODO_BACKUP_WEEKDAY:-}
      - OPENTODO_BACKUP_KEEP=${OPENTODO_BACKUP_KEEP:-}
      - OPENTODO_BACKUP_MAX_AGE_DAYS=${OPENTODO_BACKUP_MAX_AGE_DAYS:-}
      - OPENTODO_BACKUP_COMPRESS=${OPENTODO_BACKUP_COMPRESS:-}
      - OPENTODO_BACKUP_S3_ENDPOINT=${OPENTODO_BACKUP_S3_ENDPOINT:-}
      - OPENTODO_BACKUP_S3_REGION=${OPENTODO_BACKUP_S3_REGION:-}
      - OPENTODO_BACKUP_S3_BUCKET=${OPENTODO_BACKUP_S3_BUCKET:-}
      - OPENTODO_BACKUP_S3_PREFIX=${OPENTODO_BACKUP_S3_PREFIX:-}
      - OPENTODO_BACKUP_S3_ACCESS_KEY=${OPENTODO_BACKUP_S3_ACCESS_KEY:-}
      - OPENTODO_BACKUP_S3_SECRET_KEY=${OPENTODO_BACKUP_S3_SECRET_KEY:-}
      - OPENTODO_BACKUP_S3_PATH_STYLE=${OPENTODO_BACKUP_S3_PATH_STYLE:-}
      - OPENTODO_BACKUP_WEBDAV_URL=${OPENTODO_BACKUP_WEBDAV_URL:-}
      - OPENTODO_BACKUP_WEBDAV_USERNAME=${OPENTODO_BACKUP_WEBDAV_USERNAME:-}
      - OPENTODO_BACKUP_WEBDAV_PASSWORD=${OPENTODO_BACKUP_WEBDAV_PASSWORD:-}
      - OPENTODO_BACKUP_WEBDAV_ALLOW_HTTP=${OPENTODO_BACKUP_WEBDAV_ALLOW_HTTP:-}
      - OPENTODO_BACKUP_PASSPHRASE=${OPENTODO_BACKUP_PASSPHRASE:-}
      - OPENTODO_BACKUP_PASSPHRASE_FILE=${OPENTODO_BACKUP_PASSPHRASE_FILE:-}
    volumes:
      - opentodo-data:/data
    ports:
      # Only used outside Coolify; Coolify routes through its proxy to port 8080.
      - "${OPENTODO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/opentodo", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  opentodo-data:
